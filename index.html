const CATS = ["帝王","将相","思想","文学","科学","艺术","巾帼","医农","侠隐"];
const SKEY = "ink_chronicle_v1";

/* ============ 状态 ============ */
let state = {read:[], seals:[], best:0, exams:0, theme:"day"};
try{
  const raw = localStorage.getItem(SKEY);
  if(raw) state = Object.assign(state, JSON.parse(raw));
}catch(e){ console.warn("本地存储不可用，进度仅保留在本次会话", e); }
let storageOK = true;
function save(){
  try{ localStorage.setItem(SKEY, JSON.stringify(state)); }
  catch(e){
    if(storageOK){
      storageOK = false;
      setTimeout(()=>toast("浏览器未开放本地存储，进度仅保留至本次关闭"), 1400);
    }
  }
}
function applyTheme(){
  document.documentElement.setAttribute("data-theme", state.theme==="night" ? "night":"day");
  const btn = document.getElementById("themeBtn");
  btn.textContent = state.theme==="night" ? "宣纸" : "墨夜";
}
applyTheme();

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const byDyn = k => PEOPLE.filter(p => p.d === k);
const dynOf = k => DYNASTIES.find(d => d.key === k) || DYNASTIES[0];
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove("on"), 2200);
}

/* ============ 渲染：朝代尺 / 主体 ============ */
function renderRuler(){
  $("#ruler").innerHTML = DYNASTIES.map(d =>
    `<button class="ruler-item" data-key="${d.key}" title="${esc(d.full)}">${d.name}</button>`).join("");
}
function personCard(p, i){
  return `<button class="person${state.read.includes(p.n)?" read":""}" data-name="${esc(p.n)}" data-cat="${p.c}"
    style="animation-delay:${Math.min(i*28,420)}ms">
    <span class="p-cat">${p.c}</span>
    <span class="p-avatar" data-cat="${p.c}">${esc(p.n[0])}</span>
    <span class="p-name">${esc(p.n)}</span>
    <span class="p-alias">${esc(p.z||"")}</span>
    <span class="p-tag">${esc(p.t)}</span>
    <span class="p-years">${esc(p.y)}</span>
  </button>`;
}
function renderMain(){
  $("#dynasties").innerHTML = DYNASTIES.map(d=>{
    const list = byDyn(d.key);
    const got = state.seals.includes(d.key);
    return `<section class="dynasty" id="sec-${d.key}" data-key="${d.key}">
      <div class="dyn-head">
        <div class="dyn-glyph">${d.name}</div>
        <div class="dyn-meta">
          <div class="dyn-years">${esc(d.full)} · ${esc(d.years)}</div>
          <p class="dyn-desc">${esc(d.desc)}</p>
          <div class="dyn-actions">
            <span class="dyn-seal${got?" got":""}" data-key="${d.key}" title="${got?"已拓印":"未拓印"}">${d.seal}</span>
            <button class="quiz-btn${got?" done":""}" data-quiz="${d.key}">${got?"重拓此朝":"拓印答题"}</button>
            <span class="dyn-count">${list.length} 位人物 · ${(QUIZZES[d.key]||[]).length} 题</span>
          </div>
        </div>
      </div>
      <div class="people-grid">${list.map(personCard).join("")}</div>
    </section>`;
  }).join("");
  updateHero();
  setupObserver();
  applyFilter();
}
function updateHero(){
  const totalQ = Object.values(QUIZZES).reduce((a,b)=>a+b.length,0);
  $("#heroStats").innerHTML = `
    <div class="hero-stat"><b>${PEOPLE.length}</b><span>位人物</span></div>
    <div class="hero-stat"><b>${DYNASTIES.length}</b><span>个朝代切片</span></div>
    <div class="hero-stat"><b>${totalQ}</b><span>道拓印题</span></div>
    <div class="hero-stat"><b>${state.seals.length}</b><span>枚已得印章</span></div>`;
  $("#introMeta").textContent = `${PEOPLE.length} 位人物 · ${DYNASTIES.length} 朝 · 展卷即读`;
  $("#introSeal").innerHTML = sealSVG("史");
}
function sealSVG(ch){
  return `<svg viewBox="0 0 60 60" width="100%" height="100%"><rect x="3" y="3" width="54" height="54" rx="3" fill="#a5342a" filter="url(#rough)"/><text x="30" y="43" text-anchor="middle" font-size="34" fill="#fff" font-family="KaiTi,serif">${ch}</text></svg>`;
}

/* ============ 详情卷轴 ============ */
let currentPerson = null;
function openDetail(name){
  const p = PEOPLE.find(x=>x.n===name);
  if(!p) return;
  currentPerson = p;
  const same = byDyn(p.d), idx = same.findIndex(x=>x.n===p.n);
  const near = [same[idx-2],same[idx-1],same[idx+1],same[idx+2]].filter(Boolean).map(x=>x.n);
  const links = [...new Set([
    ...(p.r||[]).filter(n=>PEOPLE.some(x=>x.n===n)), ...near
  ])].slice(0,6);
  $("#detailInner").innerHTML = `
    <button class="detail-close" id="detailClose">×</button>
    <div class="d-head" data-cat="${p.c}">
      <div class="d-avatar" data-cat="${p.c}">${esc(p.n[0])}</div>
      <div><h2 class="d-name">${esc(p.n)}</h2><p class="d-alias">${esc(p.z||"")} · ${esc(p.y)}</p></div>
    </div>
    <div class="d-facts"><span class="d-fact">${esc(dynOf(p.d).full)}</span><span class="d-fact">${esc(p.c)}</span>
      ${(p.k||[]).map(k=>`<span class="d-fact">${esc(k)}</span>`).join("")}</div>
    <div class="d-tagline">${esc(p.t)}</div>
    <div class="d-section"><h4>生平</h4><p>${esc(p.b)}</p></div>
    <div class="d-section"><h4>典故</h4><p>${esc(p.a)}</p></div>
    ${p.q ? `<div class="d-section"><h4>名言</h4><div class="d-quote"><span class="qm">「</span>${esc(p.q.split("｜")[0])}<span class="qm">」</span><small>—— ${esc(p.q.split("｜")[1]||"")}</small></div></div>` : ""}
    <div class="d-section"><h4>冷知识</h4><div class="d-factbox">${esc(p.f)}</div></div>
    ${links.length?`<div class="d-section"><h4>同期人物 · 点击跳转</h4><div class="d-rel">${links.map(n=>`<button class="rel-chip" data-rel="${esc(n)}">${esc(n)} →</button>`).join("")}</div></div>`:""}
    <div class="d-foot">
      <button id="markRead" class="mark${state.read.includes(p.n)?" marked":""}">${state.read.includes(p.n)?"✓ 已读":"标记已读"}</button>
      <button id="prevPerson">← 上一人</button><button id="nextPerson">下一人 →</button>
    </div>`;
  $("#detail").classList.add("on"); $("#mask").classList.add("on");
  $("#detail").scrollTop = 0;
}
function closeDetail(){ $("#detail").classList.remove("on"); $("#mask").classList.remove("on"); }
function stepPerson(dir){
  if(!currentPerson) return;
  const i = PEOPLE.indexOf(currentPerson);
  const n = PEOPLE[(i+dir+PEOPLE.length)%PEOPLE.length];
  openDetail(n.n);
}

/* ============ 检索与筛选 ============ */
let activeCat = "";
function renderFilters(){
  $("#filters").innerHTML = `<button class="filter${activeCat?"":" on"}" data-cat="">全部</button>` +
    CATS.map(c=>`<button class="filter${activeCat===c?" on":""}" data-cat="${c}">${c}</button>`).join("");
}
function applyFilter(){
  $$(".person").forEach(el=>{
    const show = !activeCat || el.dataset.cat === activeCat;
    el.classList.toggle("hidden", !show);
  });
  const q = $("#searchInput").value.trim().toLowerCase();
  const hits = PEOPLE.filter(p=>{
    const hay = [p.n,p.z,p.t,p.b,p.a,p.f,p.q,...(p.k||[])].join(" ").toLowerCase();
    return (!activeCat || p.c===activeCat) && (!q || hay.includes(q));
  });
  $("#searchResults").innerHTML = hits.slice(0,60).map(p=>
    `<button class="sr" data-name="${esc(p.n)}"><b>${esc(p.n)}</b><small>${esc(dynOf(p.d).name)} · ${esc(p.c)}</small></button>`).join("");
  $("#searchHint").textContent = q||activeCat
    ? `命中 ${hits.length} 位 · 长卷内已同步高亮筛选${hits.length>60?"（仅显示前 60 条）":""}`
    : `共 ${PEOPLE.length} 位人物 · 可按身份筛选，或直接搜索典故、著作、关键词`;
}
function toggleSearch(on){
  $("#searchPanel").classList.toggle("on", on);
  if(on){ $("#searchInput").focus(); applyFilter(); }
}

/* ============ 时序总览 ============ */
function renderOverview(){
  $("#ovItems").innerHTML = DYNASTIES.map(d=>{
    const c = byDyn(d.key).length;
    return `<div class="ov-item${state.seals.includes(d.key)?" done":""}" data-key="${d.key}">
      <div class="ov-dot"></div><b>${d.name}</b><span>${esc(d.years)}</span><em>${c} 人${state.seals.includes(d.key)?" · 已拓":""}</em></div>`;
  }).join("");
  $("#ovLegend").innerHTML = `朱点为该朝入口，金色表示已完成「拓印答题」。<br>
    当前已集 <b style="color:var(--cinnabar)">${state.seals.length}/${DYNASTIES.length}</b> 枚印章，
    已细读 <b style="color:var(--cinnabar)">${state.read.length}/${PEOPLE.length}</b> 位人物。`;
}
function openOverlay(id){ renderOverviewIfNeeded(id); $("#"+id).classList.add("on"); }
function renderOverviewIfNeeded(id){ if(id==="overview") renderOverview(); if(id==="progress") renderProgress(); }
function closeOverlay(id){ $("#"+id).classList.remove("on"); if(id==="quiz") quizSession=null; }

/* ============ 答题：拓印 / 科举 ============ */
let quizSession = null;
function startQuiz(key, exam=false){
  let pool = exam
    ? DYNASTIES.flatMap(d=>(QUIZZES[d.key]||[]).map(q=>Object.assign({},q,{_d:d.key})))
    : (QUIZZES[key]||[]).map(q=>Object.assign({},q,{_d:key}));
  if(!pool.length){ toast("这一朝的题库还在誊写中"); return; }
  if(exam){
    pool = pool.sort(()=>Math.random()-.5).slice(0,10);
    quizSession = {list:pool, i:0, score:0, correct:0, combo:0, maxCombo:0, exam:true, answered:false};
  }else{
    quizSession = {list:pool, i:0, score:0, correct:0, combo:0, maxCombo:0, exam:false, key, answered:false};
  }
  openOverlay("quiz"); renderQuestion();
}
function renderQuestion(){
  const s = quizSession; if(!s) return;
  const q = s.list[s.i];
  const prog = (s.i / s.list.length)*100;
  $("#quizBody").innerHTML = `
    <h2>${s.exam?"科举挑战":esc(dynOf(s.key).name)+" · 拓印答题"}</h2>
    <p class="sub">${s.exam?"十题连答 · 连击有加成 · 交卷后评定功名":"答对过半即可在此朝留下朱红印章"}</p>
    <div class="quiz-progress"><i style="width:${prog}%"></i></div>
    <div class="q-index">第 ${s.i+1} / ${s.list.length} 题 ${q._d?"· "+esc(dynOf(q._d).name):""}</div>
    <h3 class="q-title">${esc(q.q)}</h3>
    <div class="q-opts">${q.o.map((o,i)=>`<button class="q-opt" data-opt="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="qExp"></div>
    <div class="q-foot"><span class="q-score" id="qScore">得分 ${s.score}${s.combo>1?" · 连击 ×"+s.combo:""}</span>
      <button class="q-next" id="qNext">${s.i===s.list.length-1?"交卷":"下一题 →"}</button></div>`;
  s.answered = false;
}
function answer(i){
  const s = quizSession; if(!s || s.answered) return;
  s.answered = true;
  const q = s.list[s.i];
  const right = i === q.a;
  $$("#quizBody .q-opt").forEach((el,idx)=>{
    el.classList.add("disabled");
    if(idx===q.a) el.classList.add("right");
    else if(idx===i) el.classList.add("wrong");
  });
  if(right){
    s.correct++; s.combo++; s.maxCombo = Math.max(s.maxCombo,s.combo);
    s.score += 10 + Math.min(s.combo-1,5)*2;
    toast(s.combo>=3 ? `连击 ${s.combo} · +${10+Math.min(s.combo-1,5)*2}` : "答对了 · +10");
  }else{ s.combo = 0; toast("答错了，看一眼解析"); }
  $("#qExp").innerHTML = `<div class="q-exp"><b>${right?"✓ 正解":"✗ 正解："+ "ABCD"[q.a] + " · " + esc(q.o[q.a])}</b><br>${esc(q.e)}</div>`;
  $("#qScore").textContent = `得分 ${s.score}${s.combo>1?" · 连击 ×"+s.combo:""}`;
  $("#qNext").classList.add("on");
}
function nextQuestion(){
  const s = quizSession; if(!s || !s.answered) return;
  if(s.i < s.list.length-1){ s.i++; renderQuestion(); }
  else finishQuiz();
}
function grade(rate){
  const r = rate;
  if(r>=.9) return ["状元","一甲及第，卷面几无瑕疵。这一趟长卷，你是真的读进去了。"];
  if(r>=.75) return ["进士","功底扎实，只在一两处典故上略一迟疑。"];
  if(r>=.55) return ["举人","主干已通，边角处还值得再翻一翻卷。"];
  if(r>=.35) return ["秀才","开了个好头，回去把没集章的朝代再走一遍。"];
  return ["童生","不必急，长卷本就该慢慢展。先从任意一朝重读起。"];
}
function finishQuiz(){
  const s = quizSession;
  let html = `<h2>${s.exam?"科举放榜":"拓印结果"}</h2><p class="sub">${s.exam?"十题已毕 · 成绩记入游学历程":"此朝答题完毕"}</p>
    <div class="q-result">`;
  if(s.exam){
    const g = grade(s.correct/s.list.length);
    state.exams++;
    if(s.score>state.best) state.best = s.score;
    html += `<div class="stamp-big">${g[0]}</div><div class="grade">${s.score}</div>
      <p>${g[1]}<br>最高连击 ${s.maxCombo} · 历史最佳 ${state.best} 分 · 累计应试 ${state.exams} 次</p>`;
  }else{
    const need = Math.ceil(s.list.length/2);
    const right = s.correct;
    const pass = s.correct >= need;
    if(pass && !state.seals.includes(s.key)){
      state.seals.push(s.key);
      html += `<div class="stamp-big">印</div><div class="grade" style="font-size:30px">${esc(dynOf(s.key).name)} · 拓印成功</div>
        <p>答对 ${right}/${s.list.length} 题，已在此朝留下朱印。<br>集齐 ${DYNASTIES.length} 枚可铺满整面印墙。</p>`;
      toast("朱印已落 · "+dynOf(s.key).name);
    }else{
      html += `<div class="grade" style="font-size:30px">${pass?"此印已在":"尚差一题"}</div>
        <p>答对 ${right}/${s.list.length} 题，需过半（${need} 题）方可拓印。<br>解析都在卷上，再读一遍便能落印。</p>`;
    }
  }
  html += `</div><div class="q-foot"><span class="q-score">印章 ${state.seals.length}/${DYNASTIES.length}</span>
    <button class="q-next on" id="qAgain">${s.exam?"再考一场":"重拓此朝"}</button></div>`;
  $("#quizBody").innerHTML = html;
  save(); renderMain(); renderRulerState();
  $("#qAgain").onclick = ()=> startQuiz(s.key||"xianqin", s.exam);
}

/* ============ 进度面板 ============ */
function renderProgress(){
  const pct = Math.round(state.read.length/PEOPLE.length*100);
  const spct = Math.round(state.seals.length/DYNASTIES.length*100);
  $("#progressBody").innerHTML = `
    <div class="prog-grid">
      <div class="prog-cell"><b>${state.read.length}</b><span>已细读人物</span></div>
      <div class="prog-cell"><b>${state.seals.length}</b><span>已得印章</span></div>
      <div class="prog-cell"><b>${state.best}</b><span>科举最高分</span></div>
      <div class="prog-cell"><b>${state.exams}</b><span>应试次数</span></div>
    </div>
    <div class="d-section"><h4>人物细读进度</h4><div class="prog-bar"><i style="width:${pct}%"></i></div><div class="prog-note">${pct}% · 还有 ${PEOPLE.length-state.read.length} 位未曾展开卷轴</div></div>
    <div class="d-section"><h4>印墙 · 集章进度 ${spct}%</h4>
      <div class="seal-wall">${DYNASTIES.map(d=>`<div class="s${state.seals.includes(d.key)?" got":""}" title="${esc(d.full)}">${d.seal}</div>`).join("")}</div>
      <div class="prog-note">每个朝代的「拓印答题」答对过半，即可落一枚朱印。</div>
    </div>
    <div class="prog-note">所有记录仅存于本机 localStorage，清除浏览器数据即会消失，不上传、不联网。</div>
    <button class="danger-link" id="resetProgress">清空全部进度</button>`;
  $("#resetProgress").onclick = ()=>{
    if(confirm("确定清空已读、印章与成绩？此操作不可撤销。")){
      state = {read:[],seals:[],best:0,exams:0,theme:state.theme};
      save(); renderMain(); renderRulerState(); renderProgress(); updateHero(); applyFilter();
      toast("进度已清空");
    }
  };
}

/* ============ 导航 / 滚动联动 ============ */
function renderRulerState(){
  $$(".ruler-item").forEach(el=>el.classList.toggle("done", state.seals.includes(el.dataset.key)));
}
let currentDyn = DYNASTIES[0].key;
/* 穿越转场锁：一次点击 = 一次动画，动画走完前所有入口都不再响应 */
let transiting = false, transitTimer = 0, transitAt = 0;
const WIPE_LOCK = (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) ? 300 : 900;
function updateNextBtn(){
  const btn = $("#nextDyn"); if(!btn) return;
  const i = DYNASTIES.findIndex(d=>d.key===currentDyn);
  const atEnd = i >= DYNASTIES.length-1;
  btn.disabled = transiting || atEnd;
  btn.textContent = transiting ? "穿越中" : (atEnd ? "已至近代" : "下一朝");
  btn.title = transiting ? "墨迹未干，动画结束后方可再穿越"
                         : (atEnd ? "已至最后一朝 · 近代" : "穿越下一朝");
}
function startTransit(){
  transiting = true; transitAt = Date.now();
  const w = $("#wipe");
  w.classList.remove("go"); void w.offsetWidth; w.classList.add("go");
  clearTimeout(transitTimer);
  transitTimer = setTimeout(endTransit, WIPE_LOCK + 300);   // 动画事件丢失时兜底解锁
  updateNextBtn();
}
function endTransit(){
  if(!transiting) return;
  const wait = WIPE_LOCK - (Date.now() - transitAt);
  if(wait > 0){ clearTimeout(transitTimer); transitTimer = setTimeout(endTransit, wait); return; }
  transiting = false; clearTimeout(transitTimer);
  $("#wipe").classList.remove("go");
  updateNextBtn();
}
function gotoDyn(key, wipe=false){
  const el = document.getElementById("sec-"+key);
  if(!el) return;
  if(wipe){
    if(transiting) return;              // 防重入：按钮 / 键盘 / 朝代尺 / 总览统一走这里
    startTransit();
    setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"start"}), 160);
  }else el.scrollIntoView({behavior:"smooth",block:"start"});
  currentDyn = key;
  updateNextBtn();
}
function setupObserver(){ syncCurrentDyn(true); }
function syncCurrentDyn(force){
  const line = window.innerHeight*0.36;
  let cur = DYNASTIES[0].key;
  $$(".dynasty").forEach(el=>{
    if(el.getBoundingClientRect().top <= line) cur = el.dataset.key;
  });
  // 触底强制判为末朝：末朝区块顶部常常只比判定线多越过几像素
  if(window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 6)
    cur = DYNASTIES[DYNASTIES.length-1].key;
  if(!force && cur === currentDyn) return;
  currentDyn = cur;
  $$(".ruler-item").forEach(el=>el.classList.toggle("on", el.dataset.key===cur));
  $$(".dynasty").forEach(el=>el.classList.toggle("active", el.dataset.key===cur));
  const on = $("#ruler .ruler-item.on"), r = $("#ruler");
  if(on && r){
    const rr = r.getBoundingClientRect(), or = on.getBoundingClientRect();
    r.scrollTo({left: r.scrollLeft + (or.left-rr.left) - (rr.width/2 - or.width/2), behavior:"smooth"});
  }
  updateNextBtn();
}
function stepDyn(dir){
  if(transiting) return;                       // 转场未走完，忽略连点
  const i = DYNASTIES.findIndex(d=>d.key===currentDyn);
  const j = i + dir;
  if(j < 0 || j >= DYNASTIES.length) return;  // 首朝向前 / 末朝向后：不再触发
  gotoDyn(DYNASTIES[j].key, true);
}

/* ============ 墨点粒子 + 山峦视差 ============ */
function initCanvas(){
  const cv = $("#inkCanvas"), ctx = cv.getContext("2d");
  let W,H,dots=[];
  function resize(){
    W = cv.width = window.innerWidth; H = cv.height = window.innerHeight;
    dots = Array.from({length: Math.min(46, Math.round(W*H/26000))},()=>({
      x:Math.random()*W, y:Math.random()*H, r:Math.random()*2.4+.5,
      v:Math.random()*.22+.06, a:Math.random()*.16+.04, ph:Math.random()*6.28
    }));
  }
  resize(); window.addEventListener("resize",resize);
  (function loop(){
    ctx.clearRect(0,0,W,H);
    const dark = document.documentElement.getAttribute("data-theme")==="night";
    dots.forEach(d=>{
      d.y -= d.v; d.ph += .008;
      if(d.y < -10){ d.y = H+10; d.x = Math.random()*W; }
      const x = d.x + Math.sin(d.ph)*11;
      ctx.beginPath(); ctx.arc(x,d.y,d.r,0,6.283);
      ctx.fillStyle = dark ? `rgba(220,214,198,${d.a*.8})` : `rgba(60,52,42,${d.a})`;
      ctx.fill();
    });
    requestAnimationFrame(loop);
  })();
}
function initParallax(){
  const layers = $$(".mountains svg");
  let ticking=false;
  function upd(){
    const y = window.scrollY;
    layers.forEach(s=>{
      const d = parseFloat(s.dataset.depth);
      s.style.transform = `translateY(${-Math.min(y*d, 230)}px)`;
    });
    syncCurrentDyn();
    ticking=false;
  }
  window.addEventListener("scroll",()=>{ if(!ticking){ requestAnimationFrame(upd); ticking=true; } },{passive:true});
  upd();
}

/* ============ 事件绑定 ============ */
function bind(){
  $("#enterBtn").onclick = enterSite;
  $("#brandBtn").onclick = ()=>window.scrollTo({top:0,behavior:"smooth"});
  $("#toTop").onclick = ()=>window.scrollTo({top:0,behavior:"smooth"});
  $("#nextDyn").onclick = ()=>stepDyn(1);
  $("#themeBtn").onclick = ()=>{ state.theme = state.theme==="night"?"day":"night"; save(); applyTheme(); toast(state.theme==="night"?"墨夜模式":"宣纸模式"); };
  $("#searchBtn").onclick = ()=>toggleSearch(!$("#searchPanel").classList.contains("on"));
  $("#searchClose").onclick = ()=>toggleSearch(false);
  $("#searchInput").addEventListener("input",applyFilter);
  $("#filters").addEventListener("click",e=>{
    const b=e.target.closest(".filter"); if(!b)return;
    activeCat = b.dataset.cat; renderFilters(); applyFilter();
  });
  $("#searchResults").addEventListener("click",e=>{
    const b=e.target.closest(".sr"); if(b) openDetail(b.dataset.name);
  });
  $("#overviewBtn").onclick = ()=>openOverlay("overview");
  $("#progressBtn").onclick = ()=>openOverlay("progress");
  $("#examBtn").onclick = ()=>startQuiz("",true);
  $("#mask").onclick = closeDetail;
  $("#detailInner").addEventListener("click",e=>{
    if(e.target.id==="detailClose") return closeDetail();
    const rel = e.target.closest(".rel-chip"); if(rel) return openDetail(rel.dataset.rel);
    if(e.target.id==="markRead" && currentPerson){
      const n=currentPerson.n, i=state.read.indexOf(n);
      if(i<0){ state.read.push(n); toast("已标记： "+n); } else { state.read.splice(i,1); toast("已取消标记"); }
      save(); renderMain(); updateHero(); openDetail(n);
    }
    if(e.target.id==="prevPerson") stepPerson(-1);
    if(e.target.id==="nextPerson") stepPerson(1);
  });
  document.addEventListener("click",e=>{
    const card=e.target.closest(".person"); if(card) return openDetail(card.dataset.name);
    const ri=e.target.closest(".ruler-item"); if(ri) return gotoDyn(ri.dataset.key,true);
    const oi=e.target.closest(".ov-item"); if(oi){ closeOverlay("overview"); return gotoDyn(oi.dataset.key,true); }
    const qb=e.target.closest(".quiz-btn"); if(qb) return startQuiz(qb.dataset.quiz,false);
    const cl=e.target.closest("[data-close]"); if(cl) return closeOverlay(cl.dataset.close);
    const opt=e.target.closest(".q-opt"); if(opt) return answer(+opt.dataset.opt);
  });
  $("#quizBody").addEventListener("click",e=>{
    if(e.target.id==="qNext") nextQuestion();
  });
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){
      closeDetail(); ["overview","quiz","progress"].forEach(closeOverlay); toggleSearch(false);
    }
    if(e.key==="/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
      e.preventDefault(); toggleSearch(true);
    }
    if((e.key==="ArrowLeft"||e.key==="ArrowRight") && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)
       && !$("#detail").classList.contains("on") && !$$(".overlay.on").length){
      e.preventDefault(); stepDyn(e.key==="ArrowRight"?1:-1);
    }
  });
}

/* ============ 开场自适应兜底 ============ */
function fitIntro(){
  const sheet = $(".intro-sheet"), inner = $(".intro-inner");
  if(!sheet || !inner || sheet.offsetParent === null) return;
  sheet.classList.remove("compact");
  sheet.style.overflowY = "hidden";
  const avail = sheet.clientHeight - 8;
  if(inner.getBoundingClientRect().height > avail){
    sheet.classList.add("compact");
    if(inner.getBoundingClientRect().height > avail) sheet.style.overflowY = "auto";
  }
}
let fitTimer;
window.addEventListener("resize", ()=>{ clearTimeout(fitTimer); fitTimer = setTimeout(fitIntro, 120); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitIntro);

/* ============ 启动 ============ */
function enterSite(){
  document.body.classList.remove("intro-lock");
  $("#intro").classList.add("gone");
  setTimeout(()=>$("#intro").style.display="none",950);
}
renderRuler();
renderMain();
renderFilters();
renderRulerState();
bind();
$("#wipe").addEventListener("animationend", e=>{ if(e.animationName==="wipe") endTransit(); });
initCanvas();
initParallax();
fitIntro();
if(location.hash.indexOf("open")>=0 || state.read.length || state.seals.length || state.exams){
  $("#intro").style.display="none";
  document.body.classList.remove("intro-lock");
}
</script>
