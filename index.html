<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>墨史 · 中国历史人物长卷</title>
<meta name="description" content="以水墨卷轴为形的中国历史人物时间轴：97 位人物、11 个朝代切片、36 道史料辨析题，可答题集印章、科举挑战评级，支持宣纸与墨夜双主题。">
<meta name="theme-color" content="#f0e8d7">
<meta property="og:type" content="website">
<meta property="og:title" content="墨史 · 中国历史人物长卷">
<meta property="og:description" content="水墨卷轴里的中国通史：97 位人物、11 个朝代、答题集印章与科举挑战，离线可用。">
<meta property="og:image" content="https://evanjason.github.io/history-chronicle/assets/og.jpg">
<meta property="og:url" content="https://evanjason.github.io/history-chronicle/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23a5342a'/%3E%3Ctext x='32' y='45' font-size='40' font-family='KaiTi,STKaiti,serif' text-anchor='middle' fill='%23f7f1e3'%3E%E5%A2%A8%3C/text%3E%3C/svg%3E">
<style>
/* ============ 基础与主题 ============ */
:root{
  --paper:#f0e8d7; --paper2:#e6dbc3; --paper3:#f7f1e3;
  --ink:#241f1a; --ink2:#4c4438; --ink3:#877c6b;
  --cinnabar:#a5342a; --cinnabar2:#c25a42; --gold:#a8843f;
  --line:rgba(36,31,26,.15); --line2:rgba(36,31,26,.30);
  --card:rgba(255,251,241,.74); --card2:rgba(255,251,241,.94);
  --shadow:0 10px 34px rgba(60,45,25,.13);
  --grain:.42; --mountain:rgba(80,78,68,.13);
  --serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  --kai:"STKaiti","KaiTi","Kaiti SC","楷体",serif;
}
html[data-theme="night"]{
  --paper:#15171b; --paper2:#1c1f24; --paper3:#20242a;
  --ink:#e9e2d3; --ink2:#c4bba8; --ink3:#8e8779;
  --cinnabar:#c35546; --cinnabar2:#dd735c; --gold:#c9a55c;
  --line:rgba(233,226,211,.14); --line2:rgba(233,226,211,.28);
  --card:rgba(32,36,42,.80); --card2:rgba(32,36,42,.96);
  --shadow:0 10px 34px rgba(0,0,0,.45);
  --grain:.22; --mountain:rgba(150,160,160,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body.intro-lock{overflow:hidden}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--serif); overflow-x:hidden;
  transition:background .7s ease,color .7s ease;
  -webkit-font-smoothing:antialiased;
}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
::selection{background:var(--cinnabar);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}

/* ============ 纸纹 / 山峦 / 墨点 ============ */
.grain{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:var(--grain);
  mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='0.42'/></svg>");
}
html[data-theme="night"] .grain{mix-blend-mode:screen;opacity:.14}
#inkCanvas{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.55}
.mountains{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.mountains svg{position:absolute;bottom:0;left:0;width:120%;height:auto;will-change:transform}
.mountains svg path{fill:var(--mountain)}
.mt1{opacity:.55}.mt2{opacity:.8}.mt3{opacity:1}

/* ============ 开场卷轴 ============ */
#intro{
  position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
  background:var(--paper2);transition:opacity .9s ease,visibility .9s;
}
#intro.gone{opacity:0;visibility:hidden;pointer-events:none}
.scroll-rod{
  position:absolute;top:0;bottom:0;width:26px;z-index:3;
  background:linear-gradient(90deg,#4e3823,#9a7448 22%,#c9a26b 48%,#7c5a35 78%,#3f2c1b);
  box-shadow:0 0 24px rgba(0,0,0,.35);
}
.scroll-rod::before,.scroll-rod::after{
  content:"";position:absolute;left:-6px;width:38px;height:22px;border-radius:4px;
  background:linear-gradient(90deg,#3a2a19,#b08a55 45%,#4a3420);
}
.scroll-rod::before{top:0}.scroll-rod::after{bottom:0}
.scroll-rod.l{left:0}.scroll-rod.r{right:0}
.intro-sheet{
  position:relative;width:min(94vw,900px);height:min(88vh,640px);
  background:var(--paper3);box-shadow:0 0 60px rgba(60,40,20,.28) inset,0 18px 60px rgba(0,0,0,.28);
  display:flex;align-items:center;justify-content:center;
  transform:scaleX(.02);transform-origin:center;
  animation:unroll 1.15s cubic-bezier(.22,.8,.25,1) .15s forwards;
  overflow:hidden;
}
@keyframes unroll{to{transform:scaleX(1)}}
/* 桌面：竖排题字居左，文字与按钮居右，整体高度只由标题决定 */
.intro-inner{
  opacity:0;animation:fadeUp .9s ease 1.05s forwards;width:100%;
  padding:20px 34px;box-sizing:border-box;text-align:center;
  display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:repeat(4,auto);
  align-content:center;align-items:center;justify-items:center;
  column-gap:clamp(18px,4vw,54px);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.intro-title{
  grid-column:1;grid-row:1/5;
  font-family:var(--kai);writing-mode:vertical-rl;text-orientation:upright;
  font-size:clamp(52px,min(7vw,11vh),92px);letter-spacing:.18em;line-height:1;
  margin:0;font-weight:700;color:var(--ink);
  text-shadow:2px 3px 0 rgba(120,100,70,.13);
}
.intro-sub{grid-column:2;grid-row:1;align-self:end;font-size:15px;letter-spacing:.28em;color:var(--ink2);margin:0 0 10px}
.intro-desc{grid-column:2;grid-row:2;font-size:13px;color:var(--ink3);letter-spacing:.1em;line-height:2;margin:0 0 26px;max-width:460px}
.enter-btn{
  grid-column:2;grid-row:3;position:relative;padding:13px 46px;border:1px solid var(--cinnabar);color:var(--cinnabar);
  font-size:17px;letter-spacing:.5em;font-family:var(--kai);cursor:pointer;
  transition:.35s;background:transparent;white-space:nowrap;
}
.enter-btn:hover{background:var(--cinnabar);color:#fff;box-shadow:0 8px 24px rgba(165,52,42,.28)}
.intro-meta{grid-column:2;grid-row:4;margin-top:22px;font-size:12px;color:var(--ink3);letter-spacing:.18em}
.intro-seal{
  position:absolute;right:7%;bottom:7%;width:52px;height:52px;opacity:.85;
  transform:rotate(-9deg);
}
/* 窄屏：回落单栏，字号同时受宽度和高度约束 */
@media(max-width:760px){
  .intro-inner{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:16px 22px;
  }
  .intro-title{font-size:clamp(40px,min(12vw,8.5vh),64px);letter-spacing:.14em;margin:0 0 16px}
  .intro-sub{align-self:center;font-size:12px;letter-spacing:.2em;margin:0 0 8px}
  .intro-desc{font-size:12px;line-height:1.8;margin:0 0 18px;max-width:330px}
  .enter-btn{padding:11px 34px;font-size:15px;letter-spacing:.36em}
  .intro-meta{margin-top:16px;font-size:11px}
  .intro-seal{width:42px;height:42px;right:5%;bottom:4%}
}
/* 矮屏 / 手机横屏：进一步压缩 */
@media(max-height:560px){
  .intro-sheet{height:94vh}
  .intro-inner{padding:8px 14px}
  .intro-title{font-size:clamp(28px,7vh,44px);letter-spacing:.08em;margin:0 0 8px}
  .intro-sub{font-size:11px;letter-spacing:.14em;margin:0 0 4px}
  .intro-desc{font-size:10px;line-height:1.5;margin:0 0 10px;max-width:420px}
  .enter-btn{padding:8px 26px;font-size:13px;letter-spacing:.28em}
  .intro-meta{margin-top:8px;font-size:10px}
  .intro-seal{width:34px;height:34px}
}
/* 运行时兜底：任何未预料的视口比例下，仍保证按钮不被裁掉 */
.intro-sheet.compact .intro-inner{padding:6px 12px}
.intro-sheet.compact .intro-title{font-size:clamp(26px,6vh,40px);letter-spacing:.06em;margin:0 0 6px}
.intro-sheet.compact .intro-desc{display:none}
.intro-sheet.compact .intro-sub{font-size:11px;margin:0 0 6px}
.intro-sheet.compact .enter-btn{padding:8px 24px;font-size:13px}
.intro-sheet.compact .intro-meta{margin-top:8px;font-size:10px}

/* ============ 顶栏 / 朝代尺 ============ */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:40;height:64px;
  display:flex;align-items:center;gap:18px;padding:0 22px;
  background:linear-gradient(180deg,var(--paper) 62%,transparent);
  backdrop-filter:blur(8px);
}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;cursor:pointer}
.brand-seal{
  width:34px;height:34px;display:grid;place-items:center;
  background:var(--cinnabar);color:#fff;font-family:var(--kai);font-size:22px;
  border-radius:3px;transform:rotate(-5deg);box-shadow:0 3px 10px rgba(165,52,42,.3);
}
.brand b{display:block;font-size:17px;letter-spacing:.16em;line-height:1.1}
.brand small{display:block;font-size:10px;color:var(--ink3);letter-spacing:.12em;margin-top:3px}
.ruler{
  flex:1;display:flex;align-items:center;gap:2px;overflow-x:auto;overflow-y:hidden;
  height:100%;scrollbar-width:none;position:relative;min-width:80px;
}
.ruler::-webkit-scrollbar{display:none}
/* 文字在上、尺线在中、刻度圆点挂在尺线上，三者互不遮挡 */
.ruler::before{
  content:"";position:absolute;left:0;right:0;top:40px;height:1px;background:var(--line2);
}
.ruler-item{
  position:relative;align-self:stretch;flex-shrink:0;padding:12px 9px 0;
  display:flex;align-items:flex-start;justify-content:center;
  font-size:13px;color:var(--ink2);
  letter-spacing:.12em;transition:.3s;white-space:nowrap;
}
.ruler-item::after{
  content:"";position:absolute;left:50%;top:40px;width:5px;height:5px;border-radius:50%;
  background:var(--paper);border:1px solid var(--line2);box-sizing:border-box;
  transform:translate(-50%,-50%);transition:.3s;
}
.ruler-item:hover{color:var(--ink)}
.ruler-item.on{color:var(--cinnabar);font-weight:700;font-size:13px}
.ruler-item.on::after{
  background:var(--cinnabar);border-color:var(--cinnabar);
  width:8px;height:8px;box-shadow:0 0 0 3px rgba(165,52,42,.14);
}
.ruler-item.done::after{background:var(--gold);border-color:var(--gold)}
.tools{display:flex;gap:6px;flex-shrink:0}
.tool{
  padding:7px 11px;font-size:12px;letter-spacing:.08em;color:var(--ink2);
  border:1px solid var(--line);border-radius:2px;transition:.25s;white-space:nowrap;
  background:var(--card);
}
.tool:hover{border-color:var(--cinnabar);color:var(--cinnabar);transform:translateY(-2px)}
.tool.primary{border-color:var(--cinnabar);color:var(--cinnabar)}

/* ============ 主时间轴 ============ */
#main{position:relative;z-index:5;max-width:1280px;margin:0 auto;padding:104px 34px 140px}
#main::before{
  content:"";position:absolute;left:52px;top:120px;bottom:120px;width:2px;
  background:linear-gradient(180deg,transparent,var(--line2) 4%,var(--line2) 96%,transparent);
}
.hero{
  position:relative;padding:0 0 66px 62px;margin-bottom:34px;
}
.hero h1{
  font-family:var(--kai);font-size:clamp(38px,6vw,70px);letter-spacing:.14em;margin:0 0 14px;
  font-weight:700;line-height:1.2;
}
.hero h1 em{font-style:normal;color:var(--cinnabar)}
.hero p{margin:0;color:var(--ink2);font-size:14px;line-height:2;letter-spacing:.08em;max-width:660px}
.hero-stats{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap}
.hero-stat b{font-family:var(--kai);font-size:26px;color:var(--cinnabar);display:block;line-height:1}
.hero-stat span{font-size:11px;color:var(--ink3);letter-spacing:.16em}
.ink-stroke{width:210px;height:16px;margin-top:22px;overflow:visible}
.ink-stroke path{
  fill:none;stroke:var(--cinnabar);stroke-width:3;stroke-linecap:round;
  stroke-dasharray:240;stroke-dashoffset:240;animation:draw 1.5s ease .6s forwards;opacity:.7;
}
@keyframes draw{to{stroke-dashoffset:0}}

.dynasty{position:relative;padding:0 0 96px 62px;scroll-margin-top:88px}
.dynasty::before{
  content:"";position:absolute;left:8px;top:34px;width:14px;height:14px;border-radius:50%;
  background:var(--paper);border:3px solid var(--ink3);transition:.4s;z-index:2;
}
.dynasty.active::before{border-color:var(--cinnabar);background:var(--cinnabar);box-shadow:0 0 0 7px rgba(165,52,42,.14)}
.dyn-head{display:flex;align-items:flex-start;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.dyn-glyph{
  font-family:var(--kai);font-size:clamp(46px,6vw,80px);line-height:.98;font-weight:700;
  writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.06em;
  color:var(--ink);border-left:3px solid var(--cinnabar);padding-left:12px;
  text-shadow:2px 2px 0 rgba(120,100,70,.10);
}
.dyn-meta{padding-top:6px;min-width:210px;flex:1}
.dyn-years{font-size:12px;letter-spacing:.2em;color:var(--cinnabar);margin-bottom:8px}
.dyn-desc{font-size:13px;line-height:2;color:var(--ink2);max-width:560px;margin:0}
.dyn-actions{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.dyn-seal{
  width:42px;height:42px;display:grid;place-items:center;font-family:var(--kai);font-size:20px;
  border:2px solid var(--line2);color:var(--ink3);border-radius:3px;transform:rotate(-6deg);
  transition:.5s;background:var(--card);
}
.dyn-seal.got{
  border-color:var(--cinnabar);color:#fff;background:var(--cinnabar);
  box-shadow:0 4px 14px rgba(165,52,42,.3);animation:stamp .6s cubic-bezier(.2,1.6,.4,1);
}
@keyframes stamp{0%{transform:scale(2.2) rotate(-18deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-6deg)}}
.quiz-btn{
  padding:8px 15px;border:1px solid var(--cinnabar);color:var(--cinnabar);font-size:12px;
  letter-spacing:.14em;border-radius:2px;transition:.25s;background:var(--card);
}
.quiz-btn:hover{background:var(--cinnabar);color:#fff}
.quiz-btn.done{border-color:var(--gold);color:var(--gold)}
.dyn-count{font-size:11px;color:var(--ink3);letter-spacing:.14em}

/* ============ 人物卡 ============ */
.people-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px;
}
.person{
  position:relative;text-align:left;padding:16px 14px 14px;border:1px solid var(--line);
  background:var(--card);border-radius:2px;transition:.32s cubic-bezier(.2,.8,.2,1);
  overflow:hidden;min-height:132px;
  animation:cardIn .55s ease both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.person::after{
  content:"";position:absolute;right:-40px;top:-40px;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle,var(--tone),transparent 70%);opacity:0;transition:.4s;
}
.person:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:var(--line2)}
.person:hover::after{opacity:.20}
.person.hidden{display:none}
.person.read::before{
  content:"已读";position:absolute;right:0;top:0;font-size:9px;letter-spacing:.1em;
  background:var(--gold);color:#fff;padding:2px 6px;border-bottom-left-radius:3px;
}
.p-avatar{
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--kai);font-size:24px;color:#fff;margin-bottom:10px;position:relative;
  background:radial-gradient(circle at 32% 28%,var(--tone2),var(--tone));
  box-shadow:inset 0 -3px 8px rgba(0,0,0,.18);
}
.p-name{font-family:var(--kai);font-size:19px;font-weight:700;letter-spacing:.06em;display:block;margin-bottom:3px}
.p-alias{font-size:10px;color:var(--ink3);display:block;margin-bottom:8px;letter-spacing:.06em}
.p-tag{font-size:11px;color:var(--ink2);line-height:1.7;display:block}
.p-cat{
  position:absolute;right:10px;top:14px;font-size:10px;color:var(--tone);
  border:1px solid currentColor;padding:1px 5px;border-radius:2px;opacity:.85;
}
.p-years{font-size:10px;color:var(--ink3);margin-top:8px;letter-spacing:.04em}

/* 身份色 */
[data-cat="帝王"]{--tone:#9a6b25;--tone2:#c9a153}
[data-cat="将相"]{--tone:#9d3a2c;--tone2:#cc6a4c}
[data-cat="思想"]{--tone:#33312c;--tone2:#6b6459}
[data-cat="文学"]{--tone:#3f6b68;--tone2:#6f9c95}
[data-cat="科学"]{--tone:#3b5480;--tone2:#6a86b3}
[data-cat="艺术"]{--tone:#6b4a7d;--tone2:#9b78ab}
[data-cat="巾帼"]{--tone:#a04460;--tone2:#d0798c}
[data-cat="医农"]{--tone:#4a6b3c;--tone2:#7d9c65}
[data-cat="侠隐"]{--tone:#6e6350;--tone2:#9c8e73}
html[data-theme="night"] .p-avatar,html[data-theme="night"] .d-avatar{filter:brightness(1.18)}
html[data-theme="night"] .p-cat{color:var(--gold)}

/* ============ 详情卷轴 ============ */
#mask{position:fixed;inset:0;background:rgba(20,16,12,.5);z-index:55;opacity:0;visibility:hidden;transition:.35s;backdrop-filter:blur(3px)}
#mask.on{opacity:1;visibility:visible}
#detail{
  position:fixed;top:0;right:0;bottom:0;width:min(540px,94vw);z-index:60;
  background:var(--paper3);box-shadow:-18px 0 60px rgba(0,0,0,.28);
  transform:translateX(102%);transition:transform .52s cubic-bezier(.22,.85,.25,1);
  overflow-y:auto;overscroll-behavior:contain;
}
#detail.on{transform:none}
.detail-rod{position:sticky;top:0;height:10px;background:linear-gradient(180deg,#a9855a,#5b4026);z-index:2}
.detail-inner{padding:26px 34px 60px}
.detail-close{position:absolute;right:22px;top:22px;font-size:22px;color:var(--ink3);z-index:3;line-height:1}
.detail-close:hover{color:var(--cinnabar)}
.d-head{display:flex;gap:18px;align-items:center;margin-bottom:8px;padding-top:16px}
.d-avatar{
  width:74px;height:74px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;
  font-family:var(--kai);font-size:40px;color:#fff;
  background:radial-gradient(circle at 32% 28%,var(--tone2),var(--tone));
  box-shadow:inset 0 -5px 14px rgba(0,0,0,.2),0 6px 18px rgba(0,0,0,.14);
}
.d-name{font-family:var(--kai);font-size:34px;font-weight:700;letter-spacing:.08em;margin:0}
.d-alias{font-size:12px;color:var(--ink3);margin:5px 0 0;letter-spacing:.1em}
.d-tagline{font-family:var(--kai);font-size:17px;color:var(--cinnabar);margin:18px 0 22px;letter-spacing:.06em}
.d-facts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.d-fact{font-size:11px;padding:4px 9px;border:1px solid var(--line2);color:var(--ink2);border-radius:2px;letter-spacing:.08em}
.d-section{margin-bottom:24px;position:relative;padding-left:16px;border-left:2px solid var(--line2)}
.d-section h4{
  margin:0 0 9px;font-size:12px;letter-spacing:.26em;color:var(--ink3);font-weight:400;
  display:flex;align-items:center;gap:8px;
}
.d-section h4::before{content:"";width:5px;height:5px;background:var(--cinnabar);transform:rotate(45deg)}
.d-section p{margin:0;font-size:14px;line-height:2.05;color:var(--ink2);text-align:justify}
.d-quote{
  font-family:var(--kai);font-size:19px;line-height:1.9;color:var(--ink);
  padding:16px 18px 16px 20px;background:var(--paper2);border-radius:2px;
  border-left:3px solid var(--cinnabar);
}
/* 引号随文成对排版，不再用绝对定位的单个「（字形像残缺方框且会压住正文） */
.d-quote .qm{color:var(--cinnabar);opacity:.55;font-size:1.08em;padding:0 2px}
.d-quote small{display:block;font-family:var(--serif);font-size:11px;color:var(--ink3);margin-top:8px;letter-spacing:.1em}
.d-factbox{
  background:var(--card);border:1px dashed var(--line2);padding:13px 15px;font-size:13px;
  line-height:1.95;color:var(--ink2);border-radius:2px;
}
.d-rel{display:flex;gap:7px;flex-wrap:wrap}
.rel-chip{
  padding:6px 11px;border:1px solid var(--line);background:var(--card);font-size:12px;
  color:var(--ink2);border-radius:2px;transition:.25s;font-family:var(--kai);
}
.rel-chip:hover{border-color:var(--cinnabar);color:var(--cinnabar);transform:translateY(-2px)}
.d-foot{display:flex;gap:10px;margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
.d-foot button{flex:1;padding:11px;border:1px solid var(--line2);font-size:12px;letter-spacing:.14em;transition:.25s}
.d-foot button:hover{border-color:var(--cinnabar);color:var(--cinnabar)}
.d-foot .mark{border-color:var(--cinnabar);color:var(--cinnabar)}
.d-foot .mark.marked{background:var(--gold);border-color:var(--gold);color:#fff}

/* ============ 通用遮罩面板 ============ */
.overlay{
  position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:.35s;padding:20px;
}
.overlay.on{opacity:1;visibility:visible}
.overlay-bg{position:absolute;inset:0;background:rgba(20,16,12,.62);backdrop-filter:blur(5px)}
.sheet{
  position:relative;width:min(760px,96vw);max-height:88vh;overflow-y:auto;
  background:var(--paper3);box-shadow:0 24px 80px rgba(0,0,0,.4);
  padding:34px 38px 40px;transform:translateY(26px) scale(.97);transition:.42s cubic-bezier(.2,.9,.25,1);
  border-top:8px solid #8a6a44;
}
.overlay.on .sheet{transform:none}
.sheet h2{font-family:var(--kai);font-size:30px;letter-spacing:.14em;margin:0 0 6px}
.sheet .sub{font-size:12px;color:var(--ink3);letter-spacing:.14em;margin:0 0 26px}
.sheet-close{position:absolute;right:20px;top:18px;font-size:24px;color:var(--ink3);line-height:1}
.sheet-close:hover{color:var(--cinnabar)}

/* 搜索 */
#searchPanel{
  position:fixed;top:64px;left:0;right:0;z-index:45;padding:18px max(22px,calc((100vw - 1280px)/2 + 34px));
  background:var(--paper2);border-bottom:1px solid var(--line2);
  transform:translateY(-120%);transition:.4s cubic-bezier(.2,.9,.25,1);box-shadow:var(--shadow);
}
#searchPanel.on{transform:none}
.search-row{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line2);padding-bottom:10px}
.search-row input{flex:1;border:0;background:transparent;outline:none;font-size:18px;font-family:var(--kai);letter-spacing:.08em}
.search-row input::placeholder{color:var(--ink3);opacity:.7}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.filter{
  font-size:11px;padding:5px 11px;border:1px solid var(--line);border-radius:20px;
  color:var(--ink3);transition:.25s;letter-spacing:.08em;
}
.filter:hover{border-color:var(--cinnabar);color:var(--cinnabar)}
.filter.on{background:var(--cinnabar);border-color:var(--cinnabar);color:#fff}
.search-results{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;max-height:190px;overflow-y:auto}
.sr{
  padding:7px 12px;background:var(--card);border:1px solid var(--line);font-size:12px;
  transition:.25s;display:flex;gap:8px;align-items:center;
}
.sr:hover{border-color:var(--cinnabar);transform:translateY(-2px)}
.sr small{color:var(--ink3);font-size:10px}
.search-hint{font-size:11px;color:var(--ink3);margin-top:12px;letter-spacing:.1em}

/* 时序总览 */
.ov-track{position:relative;overflow-x:auto;padding:20px 0 12px}
.ov-line{position:absolute;left:0;right:0;top:52px;height:2px;background:var(--line2);min-width:900px}
.ov-items{display:flex;gap:0;min-width:900px;position:relative}
.ov-item{flex:1;text-align:center;position:relative;padding-top:0;cursor:pointer}
.ov-dot{width:11px;height:11px;border-radius:50%;background:var(--paper3);border:2px solid var(--ink3);margin:46px auto 12px;transition:.3s;position:relative;z-index:2}
.ov-item:hover .ov-dot{border-color:var(--cinnabar);transform:scale(1.4)}
.ov-item.done .ov-dot{background:var(--gold);border-color:var(--gold)}
.ov-item b{display:block;font-family:var(--kai);font-size:15px;letter-spacing:.08em}
.ov-item span{display:block;font-size:10px;color:var(--ink3);margin-top:4px;white-space:nowrap}
.ov-item em{display:block;font-style:normal;font-size:10px;color:var(--cinnabar);margin-top:4px}
.ov-legend{margin-top:20px;font-size:12px;color:var(--ink3);line-height:2}

/* 答题 */
.quiz-progress{height:3px;background:var(--line);margin-bottom:24px}
.quiz-progress i{display:block;height:100%;background:var(--cinnabar);transition:.4s;width:0}
.q-index{font-size:11px;letter-spacing:.2em;color:var(--cinnabar);margin-bottom:12px}
.q-title{font-family:var(--kai);font-size:22px;line-height:1.7;margin:0 0 22px;letter-spacing:.04em}
.q-opts{display:grid;gap:9px}
.q-opt{
  text-align:left;padding:13px 16px;border:1px solid var(--line);background:var(--card);
  font-size:14px;transition:.25s;display:flex;gap:12px;align-items:center;line-height:1.6;
}
.q-opt:hover{border-color:var(--cinnabar);transform:translateX(4px)}
.q-opt .k{font-family:var(--kai);color:var(--cinnabar);font-size:16px;flex-shrink:0}
.q-opt.right{background:rgba(90,140,90,.14);border-color:#5a8c5a;color:var(--ink)}
.q-opt.wrong{background:rgba(165,52,42,.12);border-color:var(--cinnabar)}
.q-opt.disabled{pointer-events:none}
.q-exp{
  margin-top:18px;padding:14px 16px;background:var(--paper2);font-size:13px;line-height:1.95;
  color:var(--ink2);border-left:3px solid var(--gold);
}
.q-exp b{color:var(--cinnabar)}
.q-foot{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}
.q-score{font-size:12px;color:var(--ink3);letter-spacing:.1em}
.q-next{padding:10px 24px;background:var(--cinnabar);color:#fff;font-size:13px;letter-spacing:.16em;transition:.25s;opacity:0;pointer-events:none}
.q-next.on{opacity:1;pointer-events:auto}
.q-next:hover{background:var(--ink)}
.q-result{text-align:center;padding:20px 0}
.q-result .grade{font-family:var(--kai);font-size:68px;color:var(--cinnabar);line-height:1.2;margin:10px 0}
.q-result p{font-size:14px;color:var(--ink2);line-height:2}
.q-result .stamp-big{
  width:96px;height:96px;margin:18px auto;display:grid;place-items:center;
  border:4px double var(--cinnabar);color:var(--cinnabar);font-family:var(--kai);font-size:34px;
  transform:rotate(-8deg);animation:stamp .7s cubic-bezier(.2,1.6,.4,1);
}

/* 进度 */
.prog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:28px}
.prog-cell{padding:18px;background:var(--card);border:1px solid var(--line);text-align:center}
.prog-cell b{display:block;font-family:var(--kai);font-size:32px;color:var(--cinnabar);line-height:1.2}
.prog-cell span{font-size:11px;color:var(--ink3);letter-spacing:.14em}
.seal-wall{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.seal-wall .s{
  width:48px;height:48px;display:grid;place-items:center;font-family:var(--kai);font-size:21px;
  border:2px dashed var(--line2);color:var(--ink3);transform:rotate(-5deg);transition:.4s;
}
.seal-wall .s.got{border:2px solid var(--cinnabar);background:var(--cinnabar);color:#fff;border-style:solid}
.prog-bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0 8px}
.prog-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--cinnabar));transition:.6s}
.prog-note{font-size:12px;color:var(--ink3);line-height:2}
.danger-link{color:var(--ink3);font-size:11px;text-decoration:underline;margin-top:18px;display:inline-block}

/* ============ 穿越转场 / toast / 悬浮按钮 ============ */
#wipe{
  position:fixed;inset:0;z-index:80;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,transparent 0%,rgba(36,31,26,.86) 62%,var(--paper2) 100%);
  transform:scale(0);border-radius:50%;
}
#wipe.go{animation:wipe .85s ease forwards}
@keyframes wipe{0%{opacity:1;transform:scale(0)}55%{opacity:1;transform:scale(2.4)}100%{opacity:0;transform:scale(2.4)}}
#toast{
  position:fixed;left:50%;bottom:38px;transform:translate(-50%,20px);z-index:95;
  background:var(--ink);color:var(--paper);padding:11px 22px;font-size:13px;letter-spacing:.1em;
  opacity:0;transition:.35s;pointer-events:none;border-radius:2px;box-shadow:var(--shadow);
}
#toast.on{opacity:1;transform:translate(-50%,0)}
.fab{
  position:fixed;right:22px;bottom:24px;z-index:35;width:48px;height:48px;border-radius:50%;
  background:var(--cinnabar);color:#fff;display:grid;place-items:center;font-family:var(--kai);
  font-size:20px;box-shadow:0 8px 24px rgba(165,52,42,.35);transition:.3s;
}
.fab:hover{transform:translateY(-4px) rotate(10deg)}
.fab.next{right:82px;width:76px;border-radius:26px;background:var(--paper3);color:var(--cinnabar);border:1px solid var(--cinnabar);font-size:12px;letter-spacing:.06em}
/* 转场进行中 / 已到末朝：按钮给出明确回应且不可再点 */
.fab.next:disabled{
  background:var(--paper2);color:var(--ink3);border-color:var(--line2);
  box-shadow:none;opacity:.72;cursor:not-allowed;
}
.fab.next:disabled:hover{transform:none}
.foot-note{text-align:center;font-size:11px;color:var(--ink3);letter-spacing:.18em;padding:0 0 50px 62px;line-height:2}

/* ============ 响应式 ============ */

  #topbar{height:56px;padding:0 12px;gap:10px}

  .brand-seal{width:30px;height:30px;font-size:20px}

  .tools .tool:nth-child(2){display:none}
  #main{padding:82px 16px 110px}
  #main::before{left:22px}
  .hero{padding-left:34px}
  .dynasty{padding-left:34px;scroll-margin-top:70px}

  .dyn-glyph{font-size:44px}
  .people-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
  .person{min-height:118px;padding:13px 11px}
  .p-name{font-size:17px}
  .detail-inner{padding:22px 22px 50px}
  .sheet{padding:26px 22px 32px}
  .sheet h2{font-size:24px}
  .foot-note{padding-left:34px}
  #searchPanel{top:56px;padding:14px 16px}
  .fab{right:14px;bottom:16px}.fab.next{right:70px}
}
@media(max-width:520px){

  .q-title{font-size:18px}
  .hero h1{font-size:36px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

 f:"《史记》记其身高「九尺六寸」，按周尺折算约合一米九上下，时人称「长人」。他收子路、颜回、子贡等弟子不分贵贱，是「有教无类」的实际做法，而非一句自夸。",
 q:"三人行，必有我师焉｜《论语·述而》",k:["儒","论语","周游列国","教育"],r:["老子","孟子","墨子","管仲"]},
{n:"老子",z:"姓李名耳，字聃",d:"xianqin",y:"约前6世纪",c:"思想",t:"道家学派创始人，《道德经》作者",
 b:"春秋时周王室守藏室之史，掌管典籍，熟于古今兴废之变。传说周室衰微后西出函谷关，应关令尹喜之请写下五千言，即《老子》（《道德经》），以「道」与「自然」立说。",
 a:"紫气东来：传说老子过函谷关前，关令尹喜望见东方有紫气而来，知有圣人将至，后果然迎得老子并请其著书，见《史记》与后世道书。",
 f:"「祸兮福之所倚，福兮祸之所伏」出自《老子》第五十八章。今本《道德经》分道经、德经共八十一章，但 1973 年马王堆帛书本却是德经在前、道经在后，篇序与通行本相反。",
 q:"千里之行，始于足下｜《老子·第六十四章》",k:["道","道德经","无为","函谷关"],r:["孔子","庄子","韩非"]},
{n:"管仲",z:"名夷吾，字仲",d:"xianqin",y:"约前723—前645",c:"将相",t:"春秋首霸的操盘手，齐桓公之相",
 b:"由鲍叔牙举荐，相齐桓公四十年。对内分工商之乡、按土地定税，寓兵于民；对外打出「尊王攘夷」旗号，九合诸侯、一匡天下，使齐成为春秋第一位霸主。",
 a:"管鲍之交：管仲早年与鲍叔牙合伙经商，分利常多取，鲍叔牙知其贫而不以为贪；后又不计前嫌向齐桓公举荐曾射自己一钩的管仲，成为知人之交的代称。",
 f:"《管子》一书并非管仲亲撰，而是战国至西汉间稷下学者托名汇编，含《轻重》等经济篇章，其中有关物价与货币调节的论述，被视为古代最早的系统经济思想之一。",
 q:"仓廪实而知礼节，衣食足而知荣辱｜《管子·牧民》",k:["齐桓公","尊王攘夷","改革","霸业"],r:["孔子","勾践","商鞅"]},
{n:"孙子",z:"名武，字长卿",d:"xianqin",y:"约前545—前470",c:"将相",t:"兵家至圣，《孙子兵法》作者",
 b:"齐国人，因齐乱奔吴，经伍子胥举荐见吴王阖闾，以十三篇兵法相献，并被试以宫女操练。后佐吴军西破强楚、北威齐晋。所著十三篇是中国现存最早的系统军事理论著作。",
 a:"三令五申：孙子为吴王训练宫女，反复申明号令仍嬉笑不止，遂依军法斩两名队长（吴王宠姬），再令则进退齐整，见《史记·孙子吴起列传》。",
 f:"1972 年山东临沂银雀山汉墓同时出土《孙子兵法》与失传千余年的《孙膑兵法》竹简，一举证实孙武、孙膑各有其书，平息了宋代以来「孙子即孙膑」的长期怀疑。",
 q:"知彼知己，百战不殆｜《孙子兵法·谋攻篇》",k:["兵法","吴王阖闾","十三篇","知己知彼"],r:["孙膑","勾践","吴起"]},
{n:"勾践",z:"越王",d:"xianqin",y:"约前496—前465在位",c:"帝王",t:"卧薪尝胆，以二十年复国雪耻",
 b:"越王允常之子。即位初败于吴王夫差，困于会稽，被迫入吴为臣三年。归国后任用范蠡、文种，励农桑、练甲兵，趁吴北上黄池会盟时袭吴，终在前473年灭吴，成为春秋末代霸主。",
 a:"卧薪尝胆：勾践归越后「置胆于坐，坐卧即仰胆，饮食亦尝胆」，并以柴草为卧榻，时时自警会稽之耻，见《史记·越王勾践世家》。",
 f:"「卧薪」二字其实不见于《史记》，原文只记「尝胆」；把卧薪与尝胆合为一词，是北宋苏轼在《拟孙权答曹操书》中大约以游戏笔墨拼出的说法，后被南宋以降的通俗史书坐实。",
 q:"吴既赦越，越王勾践反国，乃苦身焦思，置胆于坐｜《史记·越王勾践世家》",k:["吴越","范蠡","会稽","复仇"],r:["孙子","伍子胥","管仲"]},
{n:"墨子",z:"名翟",d:"xianqin",y:"约前468—前376",c:"思想",t:"墨家创始人，主张兼爱非攻",
 b:"战国初鲁国人（一说宋人），出身工匠阶层，聚徒讲学，组织严密，其首领称「巨子」。主张兼爱、非攻、尚贤、节用，反对厚葬与奢乐；与儒家并称显学，《墨子》书中还保留大量力学、光学与守城术记载。",
 a:"止楚攻宋：闻公输般为楚造云梯将攻宋，墨子自鲁疾行十日十夜至郢，以衣带为城、木片为械与公输般九攻九拒，并告楚王弟子已守宋，终使楚罢兵，见《墨子·公输》。",
 f:"《墨经》里记「小孔成像」并解释光沿直线行进，是世界最早的光学实验记录之一；还给出杠杆、滑轮、圆与点的定义，被后世科技史家视为先秦最接近自然科学的文本。",
 q:"兼相爱，交相利｜《墨子·兼爱中》",k:["墨家","非攻","小孔成像","巨子"],r:["孔子","鲁班","孟子"]},
{n:"鲁班",z:"公输般，亦称公输子",d:"xianqin",y:"约前507—前444",c:"科学",t:"工匠之祖，木工器具的集大成者",
 b:"春秋末战国初鲁国人，与墨子同时。相传改进并创制锯、刨、钻、铲、曲尺（矩）、墨斗等木工基本工具，又善攻城器械与机关，后世土木工匠奉为祖师，「班门弄斧」即由其名而来。",
 a:"班门弄斧：在鲁班门前摆弄斧头，喻在行家面前卖弄本领。鲁班被奉为匠作之祖，故以其家门为「行家」的代称。",
 f:"文献里公输般是为楚国造云梯、与墨子推演攻守的真实人物；而锯子由草叶齿缘启发而发明、造木鸢飞三日不下等，多出自后世《事物纪原》一类笔记，属民间附会。",
 q:"",k:["木工","云梯","墨斗","祖师"],r:["墨子","墨子"]},
{n:"孟子",z:"名轲，字子舆",d:"xianqin",y:"约前372—前289",c:"思想",t:"儒家亚圣，倡仁政与民贵君轻",
 b:"战国邹人，受业于子思门人。历游齐、梁、宋、滕诸国，劝君主行仁政、制民之产，其说不见用于当世，退而与万章等弟子著《孟子》七篇。宋以后与《论语》《大学》《中庸》并列为四书。",
 a:"孟母三迁：孟母为给幼子择邻，先居墓地旁、再迁市集旁，终定居学宫之侧，见《列女传》，后成为重视环境熏染的教子典故。",
 f:"「民为贵，社稷次之，君为轻」出自《孟子·尽心下》。明太祖朱元璋读到这一句大为不悦，曾一度命人删节《孟子》，编成《孟子节文》，并短暂罢其配享孔庙。",
 q:"富贵不能淫，贫贱不能移，威武不能屈｜《孟子·滕文公下》",k:["仁政","民贵君轻","四书","性善"],r:["孔子","墨子","庄子","韩非"]},
{n:"庄子",z:"名周，字子休",d:"xianqin",y:"约前369—前286",c:"思想",t:"道家巨子，以寓言写逍遥之境",
 b:"战国宋国蒙人，曾为漆园吏。家贫而不肯应聘楚相，宁「曳尾于涂」。《庄子》今存三十三篇，内篇多出其手，以鲲鹏、庖丁、庄周梦蝶等寓言说齐物与逍遥，兼具哲学与文学价值。",
 a:"庄周梦蝶：庄子梦见自己化为蝴蝶，醒后不知是庄周梦蝶，还是蝶梦庄周，见《庄子·齐物论》，用以破除物我、真幻的执定界限。",
 f:"「庖丁解牛」原本讲的不是熟练技巧，而是「以无厚入有间」的养生与处世之道；《庄子·养生主》借刀刃十九年不钝，说人如何在缝隙密布的世界里保全自己。",
 q:"吾生也有涯，而知也无涯｜《庄子·养生主》",k:["逍遥","齐物","寓言","梦蝶"],r:["老子","孟子","韩非"]},
{n:"屈原",z:"名平，字原",d:"xianqin",y:"约前340—前278",c:"文学",t:"楚辞之祖，中国第一位留名的伟大诗人",
 b:"战国楚怀王时任左徒、三闾大夫，主张联齐抗秦、举贤授能，遭上官大夫等谗毁被疏，两度流放。秦破郢都后，于汨罗投江。所作《离骚》《九章》《天问》开楚辞一体，与《诗经》并称风骚。",
 a:"端午竞渡：相传屈原五月五日投汨罗，楚人驾舟往救不及，后以龙舟竞渡、投粽入水相纪念；此说最早见于南朝《续齐谐记》，属民俗追认，端午起源本另有夏至驱疫一脉。",
 f:"《天问》一口气向天提出一百七十余问，从宇宙开辟、日月运行问到夏商周兴亡，却始终不作解答，是中国早期最成规模的一篇「追问式」宇宙论文本。",
 q:"路漫漫其修远兮，吾将上下而求索｜《离骚》",k:["楚辞","离骚","汨罗","端午"],r:["楚怀王","宋玉"]},
{n:"商鞅",z:"公孙鞅，封于商，号商君",d:"xianqin",y:"约前390—前338",c:"将相",t:"变法强秦，为统一奠基的法家实干者",
 b:"卫国人，入秦见孝公，以霸道强国之说见用。前359、前350 年两次变法：废井田、开阡陌、行县制、奖耕战、统一度量，迁都咸阳。秦遂跃为强国；孝公死后被旧贵族诬以谋反，车裂于彤。",
 a:"徙木立信：变法前恐民不信，商鞅在国都南门立三丈之木，募人徙至北门予五十金，有人试之果得赏，随即颁下新法，见《史记·商君列传》，意在先立政府信用。",
 f:"商鞅虽被车裂，其法未废——秦惠文王杀其人而存其制。1975 年湖北云梦睡虎地出土的秦简显示，商鞅所定连坐、告奸、度量等条，百余年后仍在基层严格运行。",
 q:"治世不一道，便国不法古｜《商君书·更法》",k:["变法","秦孝公","徙木立信","法家"],r:["韩非","管仲","秦始皇"]},
{n:"韩非",z:"韩非子",d:"xianqin",y:"约前280—前233",c:"思想",t:"法家集大成者，合势、术、法为一",
 b:"韩国公子，与李斯同出荀子门下，口吃而善著书。见韩弱，屡上书变法不用，遂作《孤愤》《五蠹》《说难》。其书传入秦，秦王政读而叹恨不能与之游；后出使秦，被李斯、姚贾构陷，死于狱中。",
 a:"守株待兔：宋人耕田见兔触株折颈而死，遂释耒守株冀复得兔，见《韩非子·五蠹》，用以讥「欲以先王之政，治当世之民」的拘泥不变。",
 f:"韩非本人死于秦狱，而其学说恰被秦全盘采用：秦始皇读《五蠹》《孤愤》而推崇，李斯以同门身份执行郡县与严法。理论家未能自保，是中国政治思想史上极冷的一笔反讽。",
 q:"法不阿贵，绳不挠曲｜《韩非子·有度》",k:["法家","五蠹","荀子","秦王政"],r:["商鞅","李斯","老子","庄子"]},
{n:"扁鹊",z:"姓秦，名越人",d:"xianqin",y:"约前5世纪",c:"医农",t:"望闻问切的实际奠基人",
 b:"渤海郡郑人，师从长桑君，遍游齐、赵、周、秦行医，随俗为变：在赵为带下医，在周为耳目痹医，在秦为小儿医。《史记》为其立传，是中国正史中第一篇医家传记。",
 a:"讳疾忌医：扁鹊数见蔡桓公，谓疾在腠理、在肌肤、在肠胃，桓公皆不信；及至望见而退走，病已入骨髓，五日后果发体痛而卒，见《韩非子·喻老》。",
 f:"「扁鹊」本是上古传说中的神医名号，秦越人因医术高明被时人以此相称，本名反而不显；近人甚至怀疑《史记》所载跨数百年的扁鹊事迹，实为多位医者事迹的合传。",
 q:"疾居腠理，汤熨之所及也｜《韩非子·喻老》（《史记》转载略异）",k:["望闻问切","蔡桓公","医家","史记"],r:["韩非","华佗","张仲景"]},
{n:"妇好",z:"商王武丁之妻，庙号辛",d:"xianqin",y:"约前13世纪",c:"巾帼",t:"甲骨实证的中国最早女将军",
 b:"殷墟甲骨卜辞中反复出现「妇好」：曾一次统兵一万三千人伐羌方，为商王武丁时期最高规模的用兵之一；又主持祭祀、占卜，拥有自己的封地与财产。1976 年其墓在殷墟宫殿区被发现，出土青铜器、玉器等近两千件。",
 a:"妇好请缨：卜辞记「贞：登妇好三千，登旅万，呼伐羌」，即商王卜问是否由妇好统率一万三千人出征，是她领兵的同期直接记录。",
 f:"她的墓是殷墟唯一未被盗扰的商代王室大墓，墓中一件「妇好鸮尊」与大量青铜钺引人注目；钺在商代既是兵器更是军权象征，与卜辞中她统兵的记载彼此印证。",
 q:"（甲骨卜辞）登妇好三千，登旅万，呼伐羌｜殷墟甲骨",k:["殷墟","甲骨文","女将","武丁"],r:["商王武丁"]},
{n:"孙膑",z:"本名失传，因受膑刑称孙膑",d:"xianqin",y:"约前4世纪",c:"将相",t:"围魏救赵的谋划者",
 b:"齐国人，孙武后裔，与庞涓同门学兵法。遭庞涓嫉妒诱至魏国，被处以膑刑（去膝盖骨）与黥面，后暗随齐国使节载归，为田忌门客。桂陵、马陵两役以伏击大破魏军，庞涓自刎。所著《孙膑兵法》汉后失传。",
 a:"田忌赛马：孙膑教田忌以劣马对齐王上马、上马对中马、中马对下马，三局两胜，见《史记·孙子吴起列传》，是早期博弈与资源重排的经典例。",
 f:"《孙膑兵法》自《隋书·经籍志》后不再见于著录，宋以后学者长期怀疑孙武、孙膑本是一人。1972 年银雀山汉墓竹简同时出土两部兵法，失传近两千年的孙膑书才重见天日。",
 q:"善战者，见敌之所长，则知其所短｜《孙膑兵法·奇正》",k:["围魏救赵","马陵","银雀山","田忌"],r:["孙子","庞涓"]},

{n:"秦始皇",z:"嬴政，始皇帝",d:"qin",y:"前259—前210",c:"帝王",t:"首位完成大一统的皇帝",
 b:"秦庄襄王之子，十三岁即位，二十二岁亲政，先后灭韩、赵、魏、楚、燕、齐。称皇帝，废分封行郡县，统一文字、度量衡、货币与车轨，北筑长城、南取百越。在位求仙、严刑、大役，死后三年秦亡。",
 a:"焚书坑儒：前213 年从李斯议，焚民间所藏《诗》《书》与百家语，医药卜筮种树之书不烧；次年又坑杀咸阳方士与诸生四百六十余人。两事本不相同，后世合称，见《史记·秦始皇本纪》。",
 f:"「书同文」用的是小篆，但 1975 年睡虎地秦简、2002 年里耶秦简显示，基层官吏日常抄写其实多用更简率的秦隶。真正通行天下的，是笔头上那一套快写体，而非碑刻上的规整小篆。",
 q:"朕为始皇帝，后世以计数，二世三世至于万世｜《史记·秦始皇本纪》",k:["统一","郡县","小篆","长城"],r:["李斯","蒙恬","商鞅","韩非"]},
{n:"李斯",z:"字通古",d:"qin",y:"约前284—前208",c:"将相",t:"秦制的总设计师，亦是悲剧收场",
 b:"楚国上蔡人，荀子弟子，入秦为吕不韦舍人，后得秦王政重用。力谏逐客、献策先灭韩，统一后任丞相，主郡县、同文字、定律令，并作小篆《仓颉篇》。始皇死后与赵高合谋改诏，终被赵高构陷，腰斩于咸阳。",
 a:"谏逐客书：秦宗室因郑国渠事请逐一切客卿，李斯亦在逐中，乃上书历数秦穆公以来用由余、商鞅、张仪、范雎而成霸业，秦王读之即除逐客令，见《史记·李斯列传》。",
 f:"李斯临刑前对次子叹「吾欲与若复牵黄犬，俱出上蔡东门逐狡兔，岂可得乎」，史称「黄犬之叹」。他还是现存秦刻石（泰山、琅琊台）文字的主要书写者，小篆标准字样多出其手。",
 q:"泰山不让土壤，故能成其大｜《谏逐客书》",k:["丞相","郡县","小篆","谏逐客"],r:["秦始皇","韩非","赵高"]},
{n:"蒙恬",z:"秦将",d:"qin",y:"约前259—前210",c:"将相",t:"北却匈奴、连筑长城的秦军主帅",
 b:"祖籍齐国，祖父蒙骜、父蒙武皆为秦将。前221 年攻齐有功，后率三十万人北逐匈奴，收河南地，连接并增修战国秦、赵、燕旧长城，置四十四县，又开直道自九原抵咸阳。始皇死后被赵高矫诏赐死。",
 a:"毛笔改良传说：后世《博物志》《古今注》等称蒙恬以兔毫竹管造笔，故被奉为笔祖。然战国楚墓已出土实物毛笔（1954 年长沙左家公山），可知笔非其所创，更可能是改良与推广。",
 f:"蒙恬所筑「直道」自咸阳北至九原，全长约七百余公里，多为夯土直穿山塬，工程取向是军事快速投送而非商旅通行；部分路段至今在陕北黄土高原上仍可辨认出笔直的遗迹。",
 q:"（其事迹见）却匈奴七百余里，胡人不敢南下而牧马｜贾谊《过秦论》",k:["长城","直道","匈奴","毛笔传说"],r:["秦始皇","李斯"]},
{n:"陈胜",z:"字涉",d:"qin",y:"?—前208",c:"侠隐",t:"揭竿而起的第一人",
 b:"阳城人，雇农出身。前209 年与吴广率九百戍卒赴渔阳，遇雨失期，依秦律当斩，遂于大泽乡起义，诈称公子扶苏、项燕，号「张楚」。各地响应，一度攻至陈县称王；后为秦将章邯所破，被车夫庄贾所杀。",
 a:"苟富贵勿相忘：陈胜少时与人佣耕，辍耕之垄上怅然久之，对同伴说「苟富贵，无相忘」，同伴笑之，他叹「燕雀安知鸿鹄之志哉」，见《史记·陈涉世家》。",
 f:"司马迁把这位在位仅六个月的雇农列入「世家」——与诸侯同格，理由是「桀纣失道而汤武作，周失道而春秋作，秦失其政而陈涉发迹」，等于承认一场失败的起义才是汉家天下的起点。",
 q:"王侯将相宁有种乎｜《史记·陈涉世家》",k:["大泽乡","张楚","起义","鸿鹄之志"],r:["项羽","刘邦","秦始皇"]},
{n:"项羽",z:"名籍，字羽，西楚霸王",d:"qin",y:"前232—前202",c:"将相",t:"力能扛鼎的末代贵族战神",
 b:"下相人，楚将项燕之孙，随叔父项梁起兵。巨鹿之战破釜沉舟，九战九捷，歼秦军主力；入关后分封十八路诸侯，自立西楚霸王。楚汉相持四年，终困于垓下，突围至乌江自刎，年三十。",
 a:"破釜沉舟：渡漳河救赵时，项羽命凿沉渡船、打破炊釜、烧掉营舍，只带三日粮，示必死无还心，士卒遂以一当十，大破秦军，见《史记·项羽本纪》。",
 f:"「霸王别姬」中虞姬自刎的情节不见于《史记》，本纪只记「有美人名虞，常幸从」与项羽悲歌，虞姬和诗与自刎是后世戏曲层层添出。垓下之围见诸史册，别姬之细节属文学。",
 q:"力拔山兮气盖世，时不利兮骓不逝｜《垓下歌》（《史记·项羽本纪》）",k:["巨鹿","鸿门宴","垓下","破釜沉舟"],r:["刘邦","韩信","陈胜","张良"]},
{n:"韩信",z:"淮阴侯",d:"qin",y:"约前231—前196",c:"将相",t:"兵仙，汉家天下的一半由他打下",
 b:"淮阴人，早年贫贱，受胯下之辱。初投项羽不用，经萧何追荐拜刘邦大将。暗度陈仓定三秦，背水一战破赵，潍水袭齐，垓下十面埋伏合围项羽，历封齐王、楚王、淮阴侯。后以谋反嫌疑被吕后诱杀于长乐宫。",
 a:"胯下之辱：淮阴屠中少年当众辱韩信，令其从裤裆下爬过，韩信「孰视之，俛出袴下，蒲伏」，一市皆笑。后韩信封楚王，反召该少年任为中尉，见《史记·淮阴侯列传》。",
 f:"「明修栈道，暗度陈仓」是元代杂剧与后世小说的概括，《史记》只记「从故道还，袭雍王章邯」，并无明修栈道一节。韩信真正高明处在于把佯动与主力路线分开，而不在修栈道这一具体动作。",
 q:"狡兔死，走狗烹；飞鸟尽，良弓藏｜《史记·淮阴侯列传》",k:["背水一战","垓下","萧何","胯下之辱"],r:["刘邦","张良","项羽","萧何"]},
{n:"张良",z:"字子房，封留侯",d:"qin",y:"约前250—前186",c:"将相",t:"运筹帷幄的谋略家",
 b:"韩国贵族之后，秦灭韩后曾于博浪沙以铁椎狙击始皇车驾，误中副车。亡匿下邳，遇黄石公授《太公兵法》。后归刘邦，献计先取关中、鸿门斡旋、烧绝栈道、联英布彭越、谏止分封六国，汉兴后功成身退。",
 a:"圯上敬履：下邳桥上老人故意堕履桥下，命张良取而为之穿上，三约五日后相会，屡试其忍与诚，终授兵书，见《史记·留侯世家》，后喻敬老忍辱而得大器。",
 f:"刘邦自评「夫运筹策帷帐之中，决胜于千里之外，吾不如子房」，列三杰之首。汉初功臣多诛，张良以多病、辞封、从赤松子游自抑，是少数得善终者。",
 q:"运筹策帷帐之中，决胜于千里之外｜刘邦语，《史记·高祖本纪》",k:["留侯","鸿门宴","黄石公","三杰"],r:["刘邦","韩信","项羽","萧何"]},

/* ---------- 汉 ---------- */
{n:"刘邦",z:"字季，汉高祖",d:"han",y:"前256—前195",c:"帝王",t:"布衣出身的开国皇帝",
 b:"沛县丰邑人，曾为泗水亭长。前209 年起兵于沛，先入关中，约法三章收秦人心；鸿门脱险后受封汉王，据巴蜀汉中。经四年楚汉战争灭项羽，前202 年称帝，定都长安。汉初行郡国并行、轻徭薄赋、与民休息。",
 a:"约法三章：入咸阳后召集诸县父老，悉除秦苛法，只定「杀人者死，伤人及盗抵罪」三条，秦民大喜，唯恐沛公不为秦王，见《史记·高祖本纪》。",
 f:"刘邦四十八岁起兵、五十五岁称帝，是中国主要统一王朝开国君主中起事年龄最大的一位。他出身亭长（秦制十里一亭，掌治安与邮传），核心班底萧何、曹参是县吏，樊哙是屠狗者，堪称一次彻底的底层组队。",
 q:"大风起兮云飞扬，威加海内兮归故乡｜《大风歌》",k:["约法三章","楚汉","休养生息","布衣"],r:["项羽","韩信","张良","萧何","汉武帝"]},
{n:"萧何",z:"酂侯",d:"han",y:"前257—前193",c:"将相",t:"后方总管家，汉制的第一任架构师",
 b:"沛县人，秦时为沛主吏掾。随刘邦入关，诸将争取金帛，独他先收秦丞相府图籍文书，由此尽知天下户口、关塞与强弱。楚汉相争中镇守关中、转漕给军、补兵员不绝。汉兴任相国，定律令、作《九章律》，营未央宫。",
 a:"萧何月下追韩信：韩信因未得重用而出走，萧何不及禀报，连夜追回，并力荐其拜大将，见《史记·淮阴侯列传》，成语「成也萧何」之前一半。",
 f:"汉初论功，萧何列第一，武将不服，刘邦以「猎狗与猎人」为喻：诸将如追杀兽兔之狗，萧何是发现踪迹、指示方向的猎人，功在「发踪指示」。后世「功人功狗」之辨由此而来。",
 q:"（刘邦喻）夫猎，追杀兽兔者狗也，而发踪指示兽处者人也｜《史记·萧相国世家》",k:["九章律","关中","追韩信","图籍"],r:["刘邦","韩信","张良"]},
{n:"汉武帝",z:"刘彻，世宗孝武皇帝",d:"han",y:"前156—前87",c:"帝王",t:"把汉推向外向扩张的顶点",
 b:"景帝子，十六岁即位，在位五十四年。行推恩令削诸侯，设刺史、内朝，盐铁官营、均输平准；用卫青、霍去病北击匈奴，遣张骞通西域，设河西四郡，纳「罢黜百家、表章六经」之议。晚年下轮台罪己诏，转向息兵。",
 a:"罪己诏：征和四年（前89）武帝下《轮台诏》，否决在轮台屯田远戍之议，自陈「当今务在禁苛暴、止擅赋、力本农」，是中国皇帝公开发布自我问责文书的早期著名一例。",
 f:"「罢黜百家，独尊儒术」是后世对董仲舒对策的概括语，班固《汉书·武帝纪》原文只作「表章六经」；武帝实际用儒生饰制度、用酷吏行法度，被汉宣帝直白点破「汉家自有制度，本以霸王道杂之」。",
 q:"当今务在禁苛暴，止擅赋，力本农｜《汉书·西域传》所载《轮台诏》",k:["推恩令","河西四郡","盐铁","轮台诏"],r:["董仲舒","张骞","卫青","霍去病","司马迁"]},
{n:"张骞",z:"封博望侯",d:"han",y:"约前164—前114",c:"侠隐",t:"凿空西域，丝路由此开通",
 b:"汉中人，建元二年（前139）奉武帝命出使大月氏欲结盟夹击匈奴，途中被匈奴扣留十余年，娶妻生子而不失汉节，脱身后经大宛、康居抵大月氏，归途复被扣，元朔三年（前126）方还，同行百余人唯二人得归。后二次出使乌孙，分遣副使抵大宛、安息诸国。",
 a:"凿空：司马迁在《史记·大宛列传》以「张骞凿空」称此行，意为原本互不相通的东西道路被硬生生凿出第一个孔道，此后使者相望于道，西域与中原始成一体。",
 f:"葡萄、苜蓿、石榴、胡麻等作物与汗血马，均随张骞之后使团往来传入中原；而凿空的最初目的（联合大月氏夹击匈奴）其实完全落空——大月氏已安居妫水，无意复仇。历史的收获常不在原定目标上。",
 q:"（史迁评语）然张骞凿空，其后使往者皆称博望侯｜《史记·大宛列传》",k:["丝绸之路","西域","大月氏","博望侯"],r:["汉武帝","卫青","苏武","班超"]},
{n:"司马迁",z:"字子长，太史公",d:"han",y:"约前145—前86",c:"文学",t:"纪传体通史的开山者",
 b:"夏阳人，父司马谈为太史令。二十岁起漫游会稽、沅湘、齐鲁、梁楚，继父职后参与订太初历。天汉二年因替李陵败降辨解触怒武帝，受腐刑。忍辱著成《太史公书》（即《史记》），上起黄帝、下迄太初，凡百三十篇，创本纪、世家、列传、书、表五体。",
 a:"李陵之祸：李陵以五千步卒深入匈奴，力战矢尽而降，朝议皆罪之，司马迁独言其「事亲孝、与士信，常奋不顾身以徇国家之急」，武帝以为贰师将军李广利开脱，下蚕室。",
 f:"《史记》最初并不叫《史记》，两汉人多称《太史公书》《太史公记》；「史记」原是泛指史官所记的古名，到东汉末才渐成此书专称。全书五十二万余字，其中十篇有录无书，由后人补缀。",
 q:"人固有一死，或重于泰山，或轻于鸿毛｜《报任安书》",k:["史记","纪传体","太史令","报任安书"],r:["汉武帝","班昭","班超","司马光"]},
{n:"董仲舒",z:"广川人",d:"han",y:"约前179—前104",c:"思想",t:"把儒学推上官学位置的关键人物",
 b:"广川（今河北景县）人，景帝时为《春秋》博士，下帷讲诵、三年不窥园。武帝时连对贤良三策，主张「诸不在六艺之科、孔子之术者，皆绝其道」，并倡天人感应、大一统、德主刑辅。后任江都相、胶西相，晚年居家著《春秋繁露》。",
 a:"三年不窥园：董仲舒讲学时放下帷幕，专心诵习，三年不曾到园圃看一眼，见《汉书·董仲舒传》，后为专心治学之典。",
 f:"「天人感应」在汉代不全是玄谈：它把灾异解释为对君权的警示，等于在皇权之上安放了一个可借天意进谏的约束口。后世儒者批评灾异谶纬，却也长期沿用这套「以天制君」的话术。",
 q:"正其谊不谋其利，明其道不计其功｜《汉书·董仲舒传》",k:["天人三策","春秋繁露","大一统","儒术"],r:["汉武帝","司马迁","朱熹"]},
{n:"卫青",z:"字仲卿，长平侯",d:"han",y:"?—前106",c:"将相",t:"七击匈奴，收复河南地的主帅",
 b:"河东平阳人，出身骑奴，因姊卫子夫入宫得见武帝。元光六年（前129）首次出击匈奴即直捣龙城，此后七出塞，元朔二年夺河南地置朔方郡，元狩四年漠北之战与霍去病分道深入，击溃单于主力。官至大司马大将军，位在丞相之上，而终身谦退不养士。",
 a:"龙城飞将：王昌龄《出塞》「但使龙城飞将在，不教胡马度阴山」，「龙城」即卫青元光六年奇袭的匈奴祭天圣地，与「飞将」李广常被合指汉初良将，后世遂以之代称边将。",
 f:"卫青出身极卑：母为平阳侯家僮，本人少年时曾为骑奴、牧羊，因私生子身份被郑家奴役。他从奴仆到大司马大将军、娶平阳长公主，是汉代军功爵制仍能打通阶层的一次真实样本。",
 q:"臣幸得待罪行间，赖陛下神灵，军大捷，皆诸校尉力战之功也｜《史记·卫将军骠骑列传》",k:["河南地","朔方","漠北","匈奴"],r:["霍去病","汉武帝","李广"]},
{n:"霍去病",z:"冠军侯，骠骑将军",d:"han",y:"前140—前117",c:"将相",t:"封狼居胥，十八岁横绝漠北的少年将",
 b:"卫青外甥，十八岁以票姚校尉随军出塞，率八百轻骑深入数百里斩获二千余级，封冠军侯。此后六出塞，两度河西之战打通西域孔道，迫使浑邪王率四万众降汉；元狩四年（前119）北进二千余里，封狼居胥山、禅姑衍，登临翰海。二十四岁病卒。",
 a:"封狼居胥：元狩四年漠北大捷后，霍去病于狼居胥山筑坛祭天、于姑衍山祭地，勒石纪功而还，见《史记·卫将军骠骑列传》，此后成为中原王朝北伐最高军功的代名词。",
 f:"武帝曾为他建府第令其观看，他答「匈奴未灭，无以家为也」。河西之战后汉设武威、张掖、酒泉、敦煌四郡，这条狭长走廊正是今日甘肃版图的由来——一位二十四岁将领的战果，改写了地理。",
 q:"匈奴未灭，无以家为也｜《史记·卫将军骠骑列传》",k:["河西四郡","狼居胥","冠军侯","漠北"],r:["卫青","汉武帝","张骞"]},
{n:"王昭君",z:"名嫱，字昭君，宁胡阏氏",d:"han",y:"约前52—约前15",c:"巾帼",t:"以和亲换半世纪边宁的汉家女子",
 b:"南郡秭归人，元帝时以良家子入掖庭为待诏。竟宁元年（前33），南匈奴呼韩邪单于来朝请婿，昭君自请远嫁，号「宁胡阏氏」，生一子；呼韩邪死后依胡俗复嫁其长子复株累单于，生二女。此后汉匈边境六十余年无大兵。",
 a:"画工弃市：后世《西京杂记》称元帝按画像召幸，宫人多赂画师，昭君不肯，毛延寿遂丑绘其貌；远嫁辞行时元帝见其美貌后悔，乃穷究其事、斩画工。此说属笔记小说，正史《汉书》并无画工一节。",
 f:"「昭君出塞」在《汉书·元帝纪》《匈奴传》里只有寥寥数语：元帝「赐单于待诏掖庭王樯为阏氏」。后世戏曲、变文、诗词叠加出「琵琶」「青冢」「画工」层层情节，是历史人物被文学不断重写的最典型样本。",
 q:"（后人咏）一去紫台连朔漠，独留青冢向黄昏｜杜甫《咏怀古迹·其三》",k:["和亲","呼韩邪","青冢","竟宁"],r:["汉武帝","苏武","班超","蔡文姬"]},
{n:"苏武",z:"字子卿，典属国",d:"han",y:"前140—前60",c:"侠隐",t:"北海牧羊十九年不失汉节",
 b:"杜陵人，天汉元年（前100）以中郎将持节送匈奴使归，适逢缑王谋反事泄被扣。单于胁降不屈，乃幽置大窖断饮食，苏武啮雪吞旃得不死，后徙北海（今贝加尔湖一带）牧羝，廪食不至，掘野鼠草实而食，杖汉节牧羊，节旄尽落。昭帝时汉匈和亲，始元六年（前81）得归。",
 a:"鸿雁传书：汉使索苏武，单于诡称已死；常惠夜见汉使，教其诈言天子射上林苑得雁，雁足系帛书，言苏武等在北海某泽中。单于惊而谢罪，遂放归，见《汉书·李广苏建传》。",
 f:"苏武归汉时须发尽白，同行百余人仅九人还。他在匈奴娶胡妇生子，归国后其子苏通国后由汉廷赎回归宗——这段不那么「纯粹」的私生活，正史同样照录未讳。",
 q:"（李陵劝降时苏武所守）臣事君，犹子事父也，子为父死，无所恨｜《汉书·李广苏建传》",k:["北海","汉节","鸿雁传书","十九年"],r:["张骞","王昭君","汉武帝","班超"]},
{n:"班超",z:"字仲升，定远侯",d:"han",y:"32—102",c:"将相",t:"投笔从戎，一人经营西域三十一年",
 b:"扶风安陵人，班固之弟、班昭之兄。早年为官府抄书，尝投笔叹大丈夫当效张骞立功西域。永平十六年（73）随窦固出击匈奴，后以三十六吏士使西域，先后降鄯善、于阗、疏勒，历明、章、和三帝，官至西域都护，封定远侯，五十余国皆纳质内属。",
 a:"不入虎穴，焉得虎子：初至鄯善，匈奴使团亦到，待遇骤冷。班超夜率三十六人纵火攻杀匈奴使者，以「不入虎穴，不得虎子」决之，鄯善遂归汉，见《后汉书·班梁列传》。",
 f:"班超七十一岁上疏求归，妹班昭亦代为陈情，才得还洛阳，一月而卒。他派副使甘英西行抵条支、临西海（今波斯湾一带）而还，是汉代官方使节向西到达的最远点。",
 q:"大丈夫无他志略，犹当效傅介子、张骞立功异域，以取封侯｜《后汉书·班梁列传》",k:["西域都护","投笔从戎","三十六人","定远侯"],r:["班昭","司马迁","张骞","蔡伦"]},
{n:"蔡伦",z:"字敬仲，龙亭侯",d:"han",y:"约61—121",c:"科学",t:"改进造纸术，让文字有了廉价载体",
 b:"桂阳郡耒阳人，东汉明帝末入宫为宦者，和帝时升尚方令，主管御用器物制造。元兴元年（105）奏上以树皮、麻头、破布、旧渔网为原料的造纸法，帝善其能，自此天下通行，时称「蔡侯纸」。后因卷入窦后旧案，饮药自尽。",
 a:"蔡侯纸：蔡伦改进之纸因封龙亭侯而得名，《后汉书·宦者列传》记「自是莫不从用焉，天下咸称蔡侯纸」，是正史中为一项工艺立名的少见例子。",
 f:"蔡伦不是纸的发明者：1957 年西安灞桥、1986 年甘肃放马滩出土的西汉麻纸早于他两百年，但纸质粗厚、不便书写。蔡伦的关键贡献是确立植物纤维挫、煮、捣、抄的成套工序，并用廉价废料替代纯麻，使纸真正成为书写材料。",
 q:"（史载）用树肤、麻头及敝布、鱼网以为纸｜《后汉书·宦者列传》",k:["造纸","蔡侯纸","尚方令","四大发明"],r:["班昭","张衡","华佗","张仲景"]},
{n:"张衡",z:"字平子",d:"han",y:"78—139",c:"科学",t:"候风地动仪与浑天仪的制造者",
 b:"南阳西鄂人，通五经、善辞赋，两度任太史令，后为河间相。创制浑天仪（水力驱动的浑象）、候风地动仪，著《灵宪》《浑天仪注》论宇宙生成与天体运行，《二京赋》《归田赋》亦为汉赋名篇。被后世称为「科圣」。",
 a:"地动验陇西：顺帝永和三年（138）地动仪一龙机发吐丸，而洛阳人未觉地震，数日后陇西驿报证实当地确震，见《后汉书·张衡列传》，是仪器有效性最著名的一次记载。",
 f:"候风地动仪原件与制作图样均已失传，今中国科技馆等处所见为后人据《后汉书》一百九十六字记载所作复原模型，且复原方案（都柱／悬摆）在学界仍有分歧，不能当作原物看待。",
 q:"人生在勤，不索何获｜《后汉书·张衡列传》",k:["地动仪","浑天仪","灵宪","二京赋"],r:["蔡伦","张仲景","华佗","祖冲之"]},
{n:"华佗",z:"字元化",d:"han",y:"约145—208",c:"医农",t:"外科与麻醉的先驱，五禽戏创始人",
 b:"沛国谯人，通内、外、妇、儿各科，行医于江淮一带。创「麻沸散」用于腹腔手术，仿虎、鹿、熊、猿、鸟动作编「五禽戏」以导引强身。后因不愿专侍曹操、托辞妻病不返，被下狱拷死，所著医书焚失。",
 a:"刮骨疗毒：《三国演义》写华佗为关羽刮骨去毒、弈棋自若，属小说家言；关羽中箭在襄樊之战（219），华佗已于 208 年前后去世，二人实无缘相见。正史《三国志》只记「医为刮骨去毒」，未著医者姓名。",
 f:"《后汉书》《三国志》均载麻沸散与腹腔手术，但配方随华佗狱中焚书失传。后世有以曼陀罗花、乌头等推测者，均无定论；这段记载因此成为医学史上最著名又最不可复原的一页。",
 q:"人体欲得劳动，但不当使极尔｜《三国志·华佗传》",k:["麻沸散","五禽戏","外科","导引"],r:["张仲景","扁鹊","曹操","张衡"]},
{n:"张仲景",z:"名机，字仲景",d:"han",y:"约150—219",c:"医农",t:"医圣，《伤寒杂病论》确立辨证论治",
 b:"南阳涅阳人，灵帝时举孝廉，后任长沙太守。建安年间宗族二百余人十年内死于伤寒者三分有二，乃「勤求古训、博采众方」，撰《伤寒杂病论》十六卷。经后世整理为《伤寒论》与《金匮要略》，确立六经辨证与理法方药一体的诊疗框架。",
 a:"坐堂行医：相传张仲景任长沙太守时，值疫病流行，冲破官规于大堂公开为百姓诊脉施药，后世遂称中药铺坐诊医生为「坐堂医」、药号多冠「堂」字，属宋以后形成的行业传说。",
 f:"「医圣」之名并非汉晋时即有，而是金元以后医家逐步推尊、至明清才定型的称号；《伤寒杂病论》原书在成书后不久即散乱，今本主要靠晋代王叔和整理与宋代校正医书局校订才得以流传。",
 q:"上以疗君亲之疾，下以救贫贱之厄｜《伤寒杂病论·自序》",k:["伤寒论","金匮要略","辨证","六经"],r:["华佗","扁鹊","蔡伦","孙思邈"]},
{n:"班昭",z:"字惠班，世称曹大家",d:"han",y:"约49—120",c:"巾帼",t:"中国第一位有正史立传的女史学家",
 b:"扶风安陵人，班彪之女、班固之妹。兄班固著《汉书》未竟而卒于狱，和帝命她入东观藏书阁续成八表及《天文志》；又为《汉书》授读马融等，邓太后临朝时参预政事。另作《女诫》七篇、《东征赋》，曾上书为兄班超求归。",
 a:"续成汉书：《汉书》八表与《天文志》为班昭补作，其中《百官公卿表》《古今人表》尤见功力。范晔《后汉书·列女传》为她立传，是正史中为女性学者单独立传的早期范例。",
 f:"《女诫》长期被今人读作压制女性的文本，但把它放回东汉语境：班昭是因自家诸女「年已适人，而不渐训诲」，怕她们不习妇礼而失容于夫家才写，本为家训；其被抬为普世规范，是宋明以后的事。",
 q:"但伤诸女方当适人，而不渐训诲，不闻妇礼｜《女诫·序》",k:["汉书","东观","女诫","列女传"],r:["班超","司马迁","蔡文姬","蔡伦"]},
{n:"蔡文姬",z:"名琰，字文姬",d:"han",y:"约177—约249",c:"巾帼",t:"乱世中以记忆续书的女诗人",
 b:"陈留圉人，蔡邕之女。初嫁卫仲道，夫亡归家；汉末乱中被南匈奴掳去，居胡地十二年，生二子。建安中曹操以金璧赎归，再嫁董祀。所作《悲愤诗》述离乱之痛，传《胡笳十八拍》亦系于其名（作者归属有争议）。",
 a:"文姬归汉：曹操念蔡邕无后，遣使以金璧赎文姬归汉，而二子留胡。她默写出亡父散佚的典籍四百余篇送呈，「文姬能记诵父书」遂成抢救散佚文献的著名故事，见《后汉书·列女传》。",
 f:"《胡笳十八拍》是否蔡文姬所作，自宋代朱熹、苏轼以来聚讼千年：其骚体与句式更近唐人，最早见于宋人《乐府诗集》，多数学者倾向认为是后世拟作；而五言《悲愤诗》则较可信为本人或亲历者所作。",
 q:"（悲愤诗）马边悬男头，马后载妇女｜《后汉书·列女传》所录《悲愤诗》",k:["胡笳十八拍","悲愤诗","蔡邕","归汉"],r:["班昭","曹操","王昭君","蔡伦"]},
/* ---------- 三国两晋南北朝 ---------- */
{n:"曹操",z:"字孟德，小名阿瞒",d:"weijin",y:"155—220",c:"将相",t:"政治家、诗人，建安风骨的支点",
 b:"沛国谯人。讨董卓、迎献帝都许，「挟天子以令诸侯」；行屯田、唯才是举，官渡以少破袁绍，统一北方。位至丞相、魏王，终身未称帝，子曹丕代汉后追尊魏武帝。父子与「建安七子」共开一代诗风。",
 a:"望梅止渴：行军途中士卒渴甚，曹操谎称前方有大梅林，酸可解渴，士卒闻之口皆生水，得以及时抵水源，见《世说新语·假谲》，后喻以空想暂慰。",
 f:"「宁我负人，毋人负我」并非《三国演义》凭空捏造，最早见于《三国志·武帝纪》裴松之注引《杂记》，记其误杀吕伯奢家人后所言；罗贯中只是把这句坐成了戏里的名场面。",
 q:"老骥伏枥，志在千里；烈士暮年，壮心不已｜《龟虽寿》",k:["官渡","屯田","建安文学","魏武"],r:["诸葛亮","华佗","蔡文姬","王羲之"]},
{n:"诸葛亮",z:"字孔明，号卧龙",d:"weijin",y:"181—234",c:"将相",t:"蜀汉丞相，以制度与耐心撑起一州之地",
 b:"琅琊阳都人，避乱居襄阳隆中。207 年刘备三顾，献《隆中对》；赤壁前出使东吴促成孙刘联盟。入蜀后定律令、务农殖谷、平南中，227 年起五次北伐，234 年卒于五丈原军中。传作木牛流马、改进连弩与八阵图。",
 a:"三顾茅庐：刘备凡三往隆中乃得见诸葛亮，见《三国志·诸葛亮传》所录《出师表》自述「先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中」，后喻诚心求贤。",
 f:"「鞠躬尽瘁，死而后已」出自《后出师表》，而《后出师表》不见于《三国志》正文、首见于《汉晋春秋》注引，文风与《前出师表》迥异，作者真伪自宋代以来聚讼未决。木牛流马亦无实物与图纸传世。",
 q:"非淡泊无以明志，非宁静无以致远｜《诫子书》",k:["隆中对","出师表","北伐","木牛流马"],r:["曹操","司马懿","孙权"]},
{n:"司马懿",z:"字仲达，晋宣帝",d:"weijin",y:"179—251",c:"将相",t:"以隐忍收束三国，西晋的奠基人",
 b:"河内温县人，出身士族，建安中为曹操主簿，后辅曹丕。魏明帝时都督雍凉，拒诸葛亮北伐于渭南；又平辽东公孙渊。249 年趁曹爽陪少帝谒高平陵，发动政变夺权，此后司马氏专魏政。其孙司马炎代魏建晋，追尊宣帝。",
 a:"高平陵之变：曹爽出城，司马懿闭洛阳城门、据武库、奏免曹爽，以「谋不轨」诛其三族。此役不发一兵交战而尽夺曹魏军政，是魏晋易代真正的转折点。",
 f:"与诸葛亮对峙渭南，司马懿坚壁不出，诸葛亮遣使送巾帼妇人之饰以激之，他仍按兵不动，反详问使者「诸葛公起居饮食如何」，由「食少事烦」断其不久——忍辱至此，也近乎一种情报分析。",
 q:"（其自评）军事大要有五：能战当战，不能战当守，不能守当走｜据《晋书·宣帝纪》",k:["高平陵","渭南","西晋","隐忍"],r:["曹操","诸葛亮","王羲之"]},
{n:"王羲之",z:"字逸少，王右军",d:"weijin",y:"303—361",c:"艺术",t:"书圣，兰亭一序定下行书的高度",
 b:"琅琊临沂人，出身王氏士族，官至右军将军、会稽内史，永和十一年（355）称病去郡，誓墓不仕。博采张芝、钟繇，变汉魏质朴为妍美流便，草、隶、正、行皆精。永和九年（353）三月三日与谢安等四十一人修禊兰亭，乘兴作《兰亭集序》。",
 a:"入木三分：传说王羲之书祝版，工人削之，墨迹透入木板三分，见唐张怀瓘《书断》，后喻笔力遒劲或议论深刻。",
 f:"《兰亭集序》真迹据唐人记载随唐太宗殉葬昭陵，今所见皆为摹本或刻本，以冯承素双钩廓填「神龙本」最著。更麻烦的是：郭沫若等曾据南京出土东晋墓志与文风，质疑今本《兰亭序》及序文是否经后人改窜，论战至今未息。",
 q:"仰观宇宙之大，俯察品类之盛｜《兰亭集序》",k:["兰亭","行书","书圣","神龙本"],r:["陶渊明","顾恺之","谢安","曹操"]},
{n:"陶渊明",z:"名潜，字元亮，号五柳先生",d:"weijin",y:"约365—427",c:"文学",t:"田园诗之祖，把归隐写成一种清醒选择",
 b:"浔阳柴桑人，曾祖陶侃为东晋名将。历任江州祭酒、镇军参军，四十一岁为彭泽令，在官八十余日，因不愿束带见督邮而解印归田，此后躬耕二十余年不复出。作《归去来兮辞》《桃花源记》《饮酒》组诗，开田园诗一派。",
 a:"不为五斗米折腰：郡遣督邮至县，吏白应束带见之，陶潜叹「吾不能为五斗米折腰，拳拳事乡里小人邪」，即日解绶去职，见《晋书·陶潜传》。",
 f:"《桃花源记》末尾「南阳刘子骥，高尚士也，闻之欣然规往，未果，寻病终」，特意用一个真实可考的隐士收尾，把乌托邦轻轻按回现实——这一笔常被只读「世外桃源」四字的读者略过。",
 q:"采菊东篱下，悠然见南山｜《饮酒·其五》",k:["归去来兮辞","桃花源","田园诗","彭泽令"],r:["王羲之","顾恺之","嵇康"]},
{n:"嵇康",z:"字叔夜，竹林七贤之一",d:"weijin",y:"224—263",c:"思想",t:"魏晋风骨最锋利的一位",
 b:"谯国铚人，娶曹操曾孙女，拜中散大夫。与阮籍、山涛等游于竹林，倡「越名教而任自然」，善琴、工书、通养生，作《声无哀乐论》《与山巨源绝交书》。因不与司马氏合作，被钟会构陷，262 年下狱，次年与吕安同斩于东市，临刑索琴弹《广陵散》。",
 a:"广陵散绝：嵇康临刑东市，顾视日影，索琴弹《广陵散》，叹「袁孝尼尝请学此散，吾靳固不与，《广陵散》于今绝矣」，见《世说新语·雅量》。",
 f:"《与山巨源绝交书》名为绝交，实则通篇自陈「有必不堪者七，甚不可者二」的性情，把不愿出仕说成不适合自己的生活方式；山涛后来仍举荐其子嵇绍，二人情谊并未真断。",
 q:"越名教而任自然｜《释私论》大意，嵇康思想之纲要",k:["竹林七贤","广陵散","绝交书","中散大夫"],r:["陶渊明","司马懿","王羲之"]},
{n:"祖冲之",z:"字文远",d:"weijin",y:"429—500",c:"科学",t:"把圆周率算到小数点后七位的人",
 b:"范阳遒人，历南朝宋、齐，任南徐州从事、娄县令、长水校尉。在刘徽割圆术基础上把 π 定在 3.1415926 与 3.1415927 之间，给出约率 22/7、密率 355/113；编《大明历》首次把岁差引入历法，定一回归年为 365.2428 日；又造指南车、千里船、水碓磨，著《缀术》。",
 a:"割圆求率：承刘徽「割之弥细，所失弥少」之法，祖冲之需把圆内接正多边形逐次倍增至一万二千二百八十八边，逐层开方运算，全靠算筹完成，才得七位精度。",
 f:"密率 355/113 是分母在 16604 以内最接近 π 的分数，这一精度欧洲要到 16 世纪才重新达到。《缀术》因过于深奥，唐代算学馆定为学习年限最长的一部教材，反因此在宋以后彻底失传。",
 q:"（其历议）冬至所在，岁岁微差｜《大明历》议岁差之意",k:["圆周率","密率","大明历","缀术"],r:["张衡","贾思勰","郭守敬","沈括"]},
{n:"贾思勰",z:"北魏高阳太守",d:"weijin",y:"约5世纪末—6世纪中",c:"医农",t:"《齐民要术》，中国现存最早完整农书",
 b:"山东益都人，曾任高阳郡太守，足迹遍今山西、河北、河南一带。约 533—544 年间写成《齐民要术》十卷九十二篇，十余万字，系统记耕翻、播种、轮作、绿肥、嫁接、畜牧、酿造、食品加工与救荒，并遍引近二百种前代典籍。",
 a:"齐民要术：书名取自《史记》「齐民无藏盖」与《汉书》「齐民」之义，「齐民」即平民，「要术」即谋生之要术——书名本身说的就是：这是给寻常百姓过日子用的书。",
 f:"书中最早明确记载「谷田必须岁易」、豆科作物与禾谷轮作可肥地，还记有以绿肥压青、以桑柘间作的成套做法，比欧洲系统轮作制的文字记录早千年以上；且大量引用已散佚的《氾胜之书》《四民月令》，靠它才留下片段。",
 q:"顺天时，量地利，则用力少而成功多｜《齐民要术·种谷》",k:["农书","轮作","绿肥","北魏"],r:["祖冲之","郦道元","宋应星"]},
{n:"郦道元",z:"字善长",d:"weijin",y:"约466—527",c:"科学",t:"以一条注书写尽天下水系",
 b:"范阳涿州人，北魏时历任御史中尉、关右大使等，为政峻刻，后于阴盘驿被萧宝夤部所害。以三国《水经》为纲，广采群籍并参以实地见闻，成《水经注》四十卷，记水道一千二百余条，兼及沿革、地貌、城邑、碑刻、民俗与物产。",
 a:"注《水经》：原《水经》仅一万余字、记水 137 条，郦道元为之作注扩至三十余万字，注文反大于经文二十余倍，遂由附庸蔚为巨著，开创以水系为纲的地理书写体例。",
 f:"《水经注》保存了大量今已亡佚的汉魏碑刻、地记与神话传说，也是研究古代地名与河道变迁的核心材料；但因他身处北魏、南北分裂，南方水系多凭文献推演，记三峡等段落虽极精彩，却未必亲历。",
 q:"（写三峡）自非亭午夜分，不见曦月｜《水经注·江水》",k:["水经注","地理","三峡","北魏"],r:["贾思勰","祖冲之","徐霞客"]},
{n:"花木兰",z:"北朝民歌人物",d:"weijin",y:"约北魏（文学形象）",c:"巾帼",t:"替父从军的文学形象，非信史人物",
 b:"出自北朝乐府民歌《木兰辞》（宋《乐府诗集》收入《梁鼓角横吹曲》）。诗中女子因「阿爷无大儿，木兰无长兄」，女扮男装代父应征，「朔气传金柝，寒光照铁衣」，征战十二年归来，辞官还乡，同行伙伴「不知木兰是女郎」。正史并无其传，姓氏、籍贯、年代皆为后世附益。",
 a:"扑朔迷离：诗末「雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌」，以兔难辨雌雄作结，成语由此而来，也点破全诗关于辨识与身份的题眼。",
 f:"她本不姓花——诗中只称「木兰」。姓「花」是明代徐渭杂剧《雌木兰替父从军》给安上的，籍贯、父亲名「花弧」、从军十二年变成十八年等，也都是明清戏曲小说层层补出；把她坐实为北魏某位真实女将，属常见误读。",
 q:"朔气传金柝，寒光照铁衣｜《木兰辞》",k:["木兰辞","乐府","文学形象","代父从军"],r:["贾思勰","郦道元","秋瑾"]},

{n:"隋文帝",z:"杨坚，开皇帝",d:"sui",y:"541—604",c:"帝王",t:"结束三百年分裂，重缝南北",
 b:"弘农华阴人，北周外戚，580 年受遗诏辅政，次年（581）代周建隋，589 年灭陈统一。定三省六部雏形，地方改州县二级、罢九品中正，行均田与输籍定样，置义仓，修大兴城、开广通渠；开皇年间户口自约四百万户增至八百余万，史称开皇之治。",
 a:"一衣带水：隋将伐陈前，杨坚谓「我为百姓父母，岂可限一衣带水不拯之乎」，见《南史·陈后主纪》，以长江之窄喻必渡之志，后成成语。",
 f:"科举的起点常被算到他头上：开皇七年（587）令诸州岁贡三人，开皇十八年（598）诏以「志行修谨、清平干济」二科举人，确是分科取士之始；但以「进士科」定名的那一步，一般认为在炀帝大业年间。两件事别混为一谈。",
 q:"我为百姓父母，岂可限一衣带水不拯之乎｜《南史·陈后主纪》",k:["开皇之治","三省六部","科举","统一"],r:["李春","唐太宗","隋炀帝"]},
{n:"李春",z:"隋代石匠",d:"sui",y:"约6世纪末—7世纪初",c:"科学",t:"赵州桥的设计者，敞肩拱的先声",
 b:"生平几乎无考，仅凭唐人张嘉贞《石桥铭序》「赵郡洨河石桥，隋匠李春之迹也」留下姓名。所建安济桥（今河北赵县赵州桥）约成于 595—605 年，单孔圆弧石拱净跨约 37 米、拱高仅约 7 米，大拱两肩各开两个小拱，既减自重又利泄洪，历经多次地震与洪水仍存。",
 a:"敞肩拱：在大拱两端肩上再开小拱，是李春此桥最关键的创造。欧洲同类敞肩拱桥要到 14 世纪前后才出现，中间相差约七百余年。",
 f:"关于李春的一切，正史无一字。我们能确认他，靠的是唐开元年间宰相张嘉贞路过此桥写下的一篇铭序，以及桥下河床曾出土的隋代栏板题记；一个改变世界桥梁史的工匠，留下的个人材料不足百字。",
 q:"赵郡洨河石桥，隋匠李春之迹也｜张嘉贞《石桥铭序》",k:["赵州桥","敞肩拱","安济桥","工匠"],r:["隋文帝","宋应星","詹天佑"]},

/* ---------- 唐 ---------- */
{n:"唐太宗",z:"李世民，贞观帝",d:"tang",y:"598—649",c:"帝王",t:"贞观之治，把纳谏变成制度",
 b:"李渊次子，晋阳起兵有功，武德九年（626）玄武门之变后立为太子，旋即位。在位二十三年，完善三省六部与科举，修《唐律疏议》，行均田租庸调；纳魏征等谏，平东突厥、定吐谷浑、设安西都护府，四裔尊为「天可汗」。晚年亲征高句丽未克，服丹药而卒。",
 a:"以人为镜：魏征卒，太宗临朝叹「夫以铜为镜，可以正衣冠；以古为镜，可以知兴替；以人为镜，可以明得失……魏征殂逝，遂亡一镜矣」，见《贞观政要》。",
 f:"贞观年间中央决策有一道硬规矩：诏敕须经中书起草、门下封驳审议，门下省认为不妥可「涂窜」退回，连皇帝手敕也不例外。纳谏不只是太宗脾气好，而是被写进流程里的权力约束。",
 q:"以古为镜，可以知兴替｜《贞观政要·任贤》",k:["贞观之治","三省六部","纳谏","天可汗"],r:["武则天","魏征","玄奘","隋文帝"]},
{n:"武则天",z:"名曌，则天大圣皇后",d:"tang",y:"624—705",c:"帝王",t:"中国唯一获得正统承认的女皇帝",
 b:"并州文水人，父武士彟。637 年入宫为太宗才人，后为高宗昭仪、皇后，与高宗并称「二圣」。683 年后临朝称制，690 年改国号为周，称圣神皇帝，都洛阳。在位任狄仁杰、姚崇等，创殿试与武举、重修《姓氏录》以抑旧士族；亦任酷吏、行告密。705 年神龙政变退位，同年崩，遗制去帝号、与高宗合葬乾陵。",
 a:"无字碑：乾陵司马道东侧立一高约 7.5 米的巨碑，通体不著一字，与西侧述圣纪碑相对。碑上后世游客题刻渐满，最早的文字反而是宋金以后游人补刻。立碑初衷众说不一，有「功过留后人评」与「碑未及刻」等解释。",
 f:"殿试与武举确在她手里成形：载初元年（690）她于洛成殿亲自策问贡士，开殿试之始；长安二年（702）始设武举，考马射、步射、翘关、负重。科举由此从「及第于有司」变成「天子门生」，此后千年相沿。",
 q:"（遗制）祔庙、归陵，去帝号，称则天大圣皇后｜《旧唐书·则天皇后本纪》",k:["武周","殿试","武举","乾陵"],r:["唐太宗","玄奘","狄仁杰","李白"]},
{n:"玄奘",z:"俗名陈祎，唐三藏",d:"tang",y:"约602—664",c:"侠隐",t:"孤身西行五万里，把佛经带回并译出",
 b:"洛州缑氏人，十三岁出家，因诸家经论歧异，贞观初私发长安（时禁出境），经高昌、龟兹、碎叶等地抵天竺，入那烂陀寺从戒贤学瑜伽行派，遍游五印，以梵文论辩名动戒日王朝。贞观十九年（645）携经论 657 部返长安，此后十九年主持译场，译出 75 部、1335 卷，创法相宗；口述《大唐西域记》十二卷由弟子辩机辑录。",
 a:"宁向西死：西行至莫贺延碛，水囊倾覆、四夜五日无水，几死仍不东归，《大慈恩寺三藏法师传》记其誓「宁可就西而死，岂归东而生」，终赖老马识途得泉。",
 f:"《大唐西域记》记一百余国的山川、城郭、物产、语言与佛教遗迹，19 世纪以来成为重建印度中古史的钥匙——那烂陀寺遗址、鹿野苑、拘尸那迦等地的定位与发掘，很大程度靠这本「中国和尚的旅行笔记」反推。",
 q:"宁可就西而死，岂归东而生｜《大慈恩寺三藏法师传》",k:["大唐西域记","那烂陀","译经","丝路"],r:["唐太宗","鉴真","武则天","张骞"]},
{n:"鉴真",z:"东渡日本，唐招提寺开山",d:"tang",y:"688—763",c:"侠隐",t:"六次东渡，五次失败，第六次才抵达",
 b:"扬州江阳人，十四岁出家，后为南山律宗名僧、大明寺住持。天宝元年（742）应日僧荣叡、普照之请决心东渡，此后十年间五次受阻：官府阻拦、风浪覆舟、弟子告发、漂流至海南，其间双目失明、荣叡病故。天宝十二载（753）第六次随遣唐使船出海，次年抵奈良，为天皇及僧众授戒，建唐招提寺，763 年圆寂于日本。",
 a:"六度东行：自 742 至 753 凡六举，前五次或败于风涛、或败于人事，前后随行与病殁者数十人。日本《唐大和上东征传》逐次记录，是古代跨海求法最详尽的失败清单。",
 f:"东渡船队带去的不止戒律：随行有雕工、玉工、画师、医师，携药材、香料、经卷与佛像。唐招提寺金堂至今被视为奈良时代受唐代建筑影响最重要的现存实例之一，日本医药与书法传统亦长期奉鉴真一系为源。",
 q:"（其答弟子）是为法事也，何惜身命｜《唐大和上东征传》大意",k:["东渡","律宗","唐招提寺","奈良"],r:["玄奘","李白","孙思邈","吴道子"]},
{n:"李白",z:"字太白，号青莲居士",d:"tang",y:"701—762",c:"文学",t:"诗仙，把盛唐气象写成了自由",
 b:"祖籍陇西成纪，生于碎叶（唐安西都护府辖境，今吉尔吉斯斯坦托克马克附近），长于蜀中绵州。仗剑去国、辞亲远游，天宝元年（742）经贺知章称誉入长安为翰林供奉，三年后赐金放还；与杜甫、高适同游梁宋。安史乱中入永王李璘幕，败后系狱、长流夜郎，中途遇赦，晚依当涂令李阳冰，卒于当涂。",
 a:"铁杵磨针：传说李白少时读书未成弃去，途见老媪磨铁杵，问之，答「欲作针」，李白感其意还卒业，见宋《方舆胜览》所记眉州象耳山故事，属后世劝学附会。",
 f:"李白的出生地与族属至今聚讼：碎叶、蜀中、山东诸说并存，郭沫若等曾据其父名「李客」与碎叶经商背景推测有西域渊源。可以确定的是他不通科举——唐代商贾、罪人之后不得应举，这条制度线或许解释了他一生为何总在「干谒」与漫游之间。",
 q:"天生我材必有用，千金散尽还复来｜《将进酒》",k:["诗仙","将进酒","翰林","夜郎"],r:["杜甫","王维","白居易","武则天"]},
{n:"杜甫",z:"字子美，号少陵野老",d:"tang",y:"712—770",c:"文学",t:"诗圣，用诗为乱世留下一份实录",
 b:"河南巩县人，祖父杜审言。天宝间困守长安十年，「朝扣富儿门，暮随肥马尘」；安史乱起被俘至长安，逃奔凤翔授左拾遗，后贬华州司功参军，弃官携家入蜀，于成都浣花溪筑草堂。晚岁漂泊夔州、江陵、湘江，卒于舟中。存诗约一千四百首，「三吏三别」诸作被称为诗史。",
 a:"三吏三别：乾元二年（759）由洛阳返华州途中所作《新安吏》《石壕吏》《潼关吏》与《新婚别》《垂老别》《无家别》，以目击者口吻写征兵、离散与老妪应役，是唐诗中最接近现场报道的一组。",
 f:"杜甫生前并不「诗圣」：唐人选唐诗多不录其作，现存最早唐人选本《河岳英灵集》竟无一首杜诗。他的地位是经中唐元稹、白居易推重，至宋代经王安石、黄庭坚与江西诗派层层抬举才确立，此后千年未动。",
 q:"安得广厦千万间，大庇天下寒士俱欢颜｜《茅屋为秋风所破歌》",k:["诗史","三吏三别","草堂","安史之乱"],r:["李白","白居易","王维","韩愈"]},
{n:"白居易",z:"字乐天，号香山居士",d:"tang",y:"772—846",c:"文学",t:"主张文章合为时而著，把诗写到人人能懂",
 b:"祖籍太原，生于河南新郑。贞元十六年进士，元和间任翰林学士、左拾遗，倡新乐府，作《秦中吟》《新乐府》五十首讽时政；元和十年（815）因上书捕刺武元衡凶手被构陷，贬江州司马，作《琵琶行》。后历忠州、杭州、苏州刺史，于杭筑堤浚井，晚年居洛阳香山，官至刑部尚书。",
 a:"长安米贵：少年携诗谒顾况，顾况见其名戏曰「长安百物皆贵，居大不易」，及读「野火烧不尽，春风吹又生」，改口「有句如此，居天下有甚难」，见唐张固《幽闲鼓吹》，属文坛轶闻。",
 f:"相传白居易每作一诗，必读给不识字的老妪听，问「解否」，不解则改，直至能懂，见宋《冷斋夜话》一类笔记。真伪难考，却精准概括了他的主张：《新乐府》自序明言「其辞质而径」「其言直而切」，是自觉为传播而写。",
 q:"文章合为时而著，歌诗合为事而作｜《与元九书》",k:["新乐府","琵琶行","长恨歌","江州司马"],r:["李白","杜甫","韩愈","元稹"]},
{n:"王维",z:"字摩诘，王右丞",d:"tang",y:"约701—761",c:"艺术",t:"诗中有画，画中有诗",
 b:"河东蒲州人，开元九年进士，历太乐丞、右拾遗、监察御史，官至尚书右丞。安史乱中陷长安被迫任伪职，乱平因弟王缙请削官赎罪、且所作《凝碧池》诗见忠愤，得免。晚年隐辋川别业，半官半隐，工山水、通音律，山水诗与破墨山水并为后世宗。",
 a:"诗中有画：苏轼《书摩诘蓝田烟雨图》评「味摩诘之诗，诗中有画；观摩诘之画，画中有诗」，此后成为评价王维乃至中国诗画关系的定评。",
 f:"王维名与字连起来是「维摩诘」——《维摩诘经》里那位在家修行、辩才无碍的居士。他一生并未真正出家，却以这个佛经人物为姓名，半官半隐的辋川生活几乎是照着这个身份过的。",
 q:"行到水穷处，坐看云起时｜《终南别业》",k:["辋川","山水诗","破墨","诗中有画"],r:["李白","杜甫","白居易","吴道子"]},
{n:"孙思邈",z:"药王，孙真人",d:"tang",y:"约581—682",c:"医农",t:"把医德写在医书第一卷的人",
 b:"京兆华原（今陕西铜川）人，通老庄与百家，屡辞隋、唐征召，隐太白、终南山行医。著《备急千金要方》三十卷、《千金翼方》三十卷，卷首专列《大医精诚》论医者之心，卷中详载妇、儿、内、外、针灸、养生与药材产地，并总结唐以前各家方剂。",
 a:"虎守杏林：后世传说孙思邈为虎取出喉中骨刺，虎感其恩，常守于其诊处杏林旁；「杏林」典出三国董奉种杏济贫，二事后来合流，成为医家德行的象征。属民间传说。",
 f:"《千金方》记用羊靥（羊甲状腺）治瘿（甲状腺肿）、以谷皮煎汤防脚气、以动物肝脏治夜盲，分别对应今日碘、维生素 B1 与维生素 A 的缺乏症，虽当时不知其理，经验记录却相当准确。",
 q:"人命至重，有贵千金，一方济之，德逾于此｜《备急千金要方·序》",k:["千金方","大医精诚","药王","食疗"],r:["张仲景","华佗","鉴真","李时珍"]},
{n:"一行",z:"俗名张遂，一行禅师",d:"tang",y:"683—727",c:"科学",t:"世界首次实测子午线长度的僧人",
 b:"魏州昌乐人，唐初功臣张公谨曾孙，避武三思结交出家，师善无畏、金刚智，为密宗要僧。开元间奉诏改历，与梁令瓒制黄道游仪、水运浑天仪，主持河南四地日影与北极高度实测，推得子午线一度长约 351 里 80 步，编成《大衍历》（729 年颁行），为后世历法范式。",
 a:"四海测影：开元十二年（724），一行遣南宫说等于滑州白马、汴州浚仪、许州扶沟、豫州上蔡四处，同日测晷影、量极高、丈量地面距离，由影差推求「寸差千里」之说的虚实，是我国第一次有组织的大地测量。",
 f:"他得到的「三百五十一里八十步」折合今制约 131 公里，与现代子午线一度约 111 公里相比偏大，但关键在于：这是把「日影一寸、地差千里」的旧假设拿去实测并发现它不成立——方法比数值更重要。水运浑天仪中的擒纵机构，也常被列为机械钟的远祖之一。",
 q:"（史载）一行少聪敏，博览经史，尤精历象、阴阳、五行之学｜《旧唐书·一行传》",k:["大衍历","子午线","黄道游仪","四海测验"],r:["郭守敬","张衡","祖冲之","玄奘"]},

/* ---------- 宋 ---------- */
{n:"宋太祖",z:"赵匡胤，庙号太祖",d:"song",y:"927—976",c:"帝王",t:"以一次兵变结束五代，以一杯酒收兵权",
 b:"涿郡人，后周殿前都点检。显德七年（960）陈桥兵变黄袍加身，代周建宋。即位后先南后北，平荆湖、后蜀、南汉、南唐；收藩镇兵、财、刑权，设转运使、更戍法，扩大科举并亲自主持殿试，立「不杀士大夫及上书言事人」之戒。开宝九年（976）猝崩，弟赵光义继位，史有烛影斧声之疑。",
 a:"杯酒释兵权：建隆二年（961）太祖宴石守信、王审琦等禁军将帅，晓以「孰不欲为富贵」之患，次日诸将皆称病请解兵柄，改授节度使虚衔，见《续资治通鉴长编》，以极小代价完成一次军权集中。",
 f:"开宝六年（973）太祖因知贡举李昉取士不公，亲自于讲武殿复试落第举子，另赐及第，殿试自此成为常制，及第者遂称「天子门生」。原意是防考官结党，客观效果是把及第者的忠诚直接系到皇帝身上。",
 q:"卧榻之侧，岂容他人鼾睡耶｜《续资治通鉴长编》载其对南唐使语",k:["陈桥兵变","杯酒释兵权","殿试","重文抑武"],r:["王安石","范仲淹","苏轼","唐太宗"]},
{n:"范仲淹",z:"字希文，范文正公",d:"song",y:"989—1052",c:"将相",t:"先忧后乐，士大夫气象的标尺",
 b:"苏州吴县人，幼孤，随母改嫁，苦学于应天书院，大中祥符八年进士。历任泰州西溪盐官（筑捍海堰）、苏州知州、开封知府；康定元年（1040）经略陕西，与韩琦同御西夏，边防为之一固。庆历三年（1043）任参知政事，上《答手诏条陈十事》行庆历新政，次年罢。晚年知邓、杭、青州，卒于赴颍州途中。",
 a:"断齑画粥：少年寄居长白山僧舍苦读，每日煮粥一器，凝后划为四块，佐以切碎腌菜，分两日食，见《宋名臣言行录》，后为寒素苦学之典。",
 f:"「先天下之忧而忧，后天下之乐而乐」出自《岳阳楼记》，而范仲淹写此文时并未到过岳阳楼——应好友滕子京之请，仅据一幅《洞庭晚秋图》与既有文献落笔。一篇凭想象写成的文章，成了此后千年士人的自勉。",
 q:"先天下之忧而忧，后天下之乐而乐｜《岳阳楼记》",k:["庆历新政","岳阳楼记","西北边防","义田"],r:["王安石","司马光","宋太祖","苏轼"]},
{n:"王安石",z:"字介甫，号半山，荆国公",d:"song",y:"1021—1086",c:"将相",t:"熙宁变法：一次全面的国家理财实验",
 b:"抚州临川人，庆历二年进士，历鄞县知县、常州知州、提点江东刑狱，在鄞县试贷谷于民、立保伍有实效。熙宁二年（1069）参知政事，次年拜相，设制置三司条例司，推行青苗、免役、均输、市易、农田水利、方田均税、保甲、保马诸法，并改革科举与学校。两度罢相，元丰八年神宗崩后新法渐罢，退居江宁半山园。",
 a:"三不足：《宋史·王安石传》记时人谓其持「天变不足畏，祖宗不足法，人言不足恤」之说，成为变法精神的凝练口号。需留意：这三句是反对派与史臣的概括语，未必是他一字不易的自陈。",
 f:"青苗法的设计本意是：青黄不接时由官府低息贷粮给农户，秋收归还，既救急又抑兼并。但在考成压力下，地方官强摊贷款、加息催收，良法反而成了负担——制度设计与执行激励脱节，是这场变法留给后世最实在的一课。",
 q:"看似寻常最奇崛，成如容易却艰辛｜《题张司业诗》",k:["熙宁变法","青苗法","唐宋八大家","半山"],r:["司马光","苏轼","范仲淹","宋太祖"]},
{n:"司马光",z:"字君实，迂叟，温国公",d:"song",y:"1019—1086",c:"思想",t:"以十九年编一部给君主看的教科书",
 b:"陕州夏县人，宝元元年进士，历知谏院、翰林学士。因与王安石政见不合，熙宁间自请闲职居洛阳，专意修史，元丰七年（1084）成《资治通鉴》二百九十四卷，上起战国、下讫五代，凡一千三百六十二年。元丰八年哲宗立、高太后听政，入朝为相，尽罢新法，次年卒。",
 a:"警枕励志：司马光为写《资治通鉴》，以一段圆木为枕，熟睡中稍一翻身即滚落惊醒，便起身续写，见宋人笔记，后与「圆木警枕」同为勤学之典。",
 f:"《资治通鉴》不是一人之作：司马光设书局于洛阳，刘恕、刘攽、范祖禹分任三代至五代长编，先作丛目、再成长编、最后由他一人删定考异，并另成《通鉴考异》三十卷说明取舍理由——「考异」这一体例，是中国史学自觉处理史料矛盾的重要一步。",
 q:"鉴于往事，有资于治道｜宋神宗《资治通鉴》序语（书名取义）",k:["资治通鉴","编年体","考异","元祐更化"],r:["王安石","范仲淹","苏轼","司马迁"]},
{n:"苏轼",z:"字子瞻，号东坡居士",d:"song",y:"1037—1101",c:"文学",t:"一贬再贬，却把每个贬所都过成了故乡",
 b:"眉州眉山人，嘉祐二年进士，欧阳修惊其文。因不附新法自请外任，历杭、密、徐、湖州；元丰二年（1079）以诗文讥讽朝政下御史台狱百三十日，是为乌台诗案，贬黄州团练副使，作前后《赤壁赋》《念奴娇》《定风波》。元祐间回朝任翰林学士，又因不附旧党再请外任，知杭州时疏浚西湖、筑长堤。绍圣后贬惠州、儋州，元符三年北归，卒于常州。",
 a:"乌台诗案：御史台（别称乌台）摘其《湖州谢上表》及《山村五绝》等诗句，指为「愚弄朝廷、妄自尊大」，系狱逾四月，几致死，因太后与朝臣营救得贬黄州。是中国文字狱史上最著名的一桩诗案。",
 f:"东坡肉、苏堤、惠州荔枝、儋州办学，常被讲成文人雅趣，其实都是他无权无钱时的务实之举：在黄州开垦城东坡地自给，才有「东坡」之号；在杭州以工代赈浚湖；在儋州设学，海南历史上第一位进士姜唐佐即出其门下。",
 q:"竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生｜《定风波》",k:["乌台诗案","赤壁赋","苏堤","唐宋八大家"],r:["王安石","司马光","李清照","辛弃疾","范仲淹"]},
{n:"李清照",z:"号易安居士",d:"song",y:"1084—约1155",c:"巾帼",t:"提出词「别是一家」，也亲历了南渡之痛",
 b:"齐州章丘人，父李格非为苏门后四学士之一，夫赵明诚，二人共治金石，合撰《金石录》。靖康之变后南渡，青州故第书画十余屋毁于兵火，赵明诚病卒，所藏散失殆尽，晚年流寓临安。词以南渡为界，前期清丽、后期沉郁，另作《词论》主张词「别是一家」，不混同于诗文。",
 a:"赌书泼茶：李清照《金石录后序》自记与赵明诚饭后坐归来堂烹茶，指堆积书史，言某事在某书某卷第几页第几行，以中否角胜负，中即举杯大笑，至茶倾覆怀中，反不得饮。后世遂以之喻夫妇读书之乐。",
 f:"宋代文献（如《建炎以来系年要录》）记她晚年曾再嫁张汝舟，不久即告其虚报举数欺官，请求离异；依宋律妻告夫须徒二年，她仍提起诉讼并因此系狱，后得亲友缓颊。此事明清学者多力辩为诬，至今仍有争议，却也说明她不是只会被动承受的人。",
 q:"生当作人杰，死亦为鬼雄｜《夏日绝句》",k:["金石录","词论","婉约","南渡"],r:["苏轼","辛弃疾","岳飞","班昭"]},
{n:"岳飞",z:"字鹏举，鄂王，谥武穆",d:"song",y:"1103—1142",c:"将相",t:"以军纪与战功立身，以「莫须有」收场",
 b:"相州汤阴人，出身佃农，宣和间应募从军。绍兴四年（1134）收复襄阳六郡，十年（1140）郾城、颍昌以背嵬军破金军铁浮图，进军朱仙镇，一日内接十二道金字牌被迫班师。十一年（1142）被夺兵权，秦桧等以「莫须有」构陷，与子岳云、部将张宪同死于狱，年三十九。孝宗时平反追谥武穆，后封鄂王。",
 a:"尽忠报国：《宋史·岳飞传》记何铸鞫讯时，飞「裂裳以背示铸，有『尽忠报国』四大字，深入肤理」。后世戏曲小说改作「精忠报国」，与原文一字之差。",
 f:"岳家军「冻死不拆屋，饿死不掳掠」并非宣传口号：《宋史》载其军行至村市，夜宿门外，民开门纳之无敢入；士卒取民麻一缕束刍即斩以徇。军队纪律在募兵制时代能维持到这一步，比战绩更能解释他为何被民间长久记住。",
 q:"三十功名尘与土，八千里路云和月｜《满江红·写怀》（作者归属有争议）",k:["郾城","十二道金牌","尽忠报国","莫须有"],r:["文天祥","李清照","辛弃疾","秦桧"]},
{n:"文天祥",z:"字宋瑞，又字履善，号文山",d:"song",y:"1236—1283",c:"侠隐",t:"以一介书生，把结局走成了人格标尺",
 b:"吉州庐陵人，宝祐四年（1256）状元。德祐元年（1275）闻元军南下，于江西变卖家产募兵勤王，友人或止之，他答「吾亦知其然也，第国家养育臣庶三百余年，一旦有急，征天下兵，无一人一骑入关者，吾深恨于此」。次年赴元营谈判被扣，镇江脱险，转战闽粤；祥兴元年（1278）五坡岭兵败，吞冰片不死被俘。囚大都三年，屡拒降，1283 年就义，年四十七。",
 a:"衣带绝笔：就义后，其妻欧阳氏收尸，于衣带中得绝笔「孔曰成仁，孟曰取义。惟其义尽，所以仁至。读圣贤书，所学何事？而今而后，庶几无愧」，见《宋史·文天祥传》。",
 f:"被囚三年间，元廷先后以宰相之位劝降，遣已降的宋恭帝、其弟文璧乃至女儿书信相劝，他均不答；狱中作《正气歌》，历数「在齐太史简，在晋董狐笔」等十二例，把抵抗写成了一份可传承的精神谱系。",
 q:"人生自古谁无死？留取丹心照汗青｜《过零丁洋》",k:["正气歌","过零丁洋","勤王","成仁取义"],r:["岳飞","辛弃疾","陆游","林则徐"]},
{n:"沈括",z:"字存中，号梦溪丈人",d:"song",y:"1031—1095",c:"科学",t:"《梦溪笔谈》，一部写在笔记里的科学史",
 b:"钱塘人，至和元年以父荫入仕，嘉祐八年进士，参与熙宁变法，提举司天监、权三司使，曾出使辽国驳其地界之请，后任鄜延路经略安抚使御西夏。永乐城之败坐贬随州，晚居润州梦溪园，著《梦溪笔谈》二十六卷及《补笔谈》《续笔谈》，约六百余条。",
 a:"石油得名：《梦溪笔谈》记「鄜延境内有石油，旧说高奴县出脂水，即此也」，并预言「此物后必大行于世」——「石油」一词即由此首次定名，沿用至今。",
 f:"毕昇的泥活字、指南针「常微偏东，不全南也」（磁偏角）、隙积术与会圆术、太行山崖间螺蚌化石推论「此乃昔之海滨」，全部靠《梦溪笔谈》才留下记录。若无这一本笔记，宋代几项最要紧的技术发现会集体失载。",
 q:"（记磁偏角）方家以磁石磨针锋，则能指南，然常微偏东，不全南也｜《梦溪笔谈·杂志一》",k:["梦溪笔谈","石油","磁偏角","活字"],r:["毕昇","祖冲之","郭守敬","王安石"]},
{n:"毕昇",z:"北宋布衣，活字印刷发明者",d:"song",y:"约970—1051",c:"科学",t:"把「字」变成可重排的单元",
 b:"生平仅见于沈括《梦溪笔谈·技艺》一条：庆历中（1041—1048）布衣毕昇为活板，用胶泥刻字，薄如钱唇，每字一印，火烧令坚；设铁范，敷松脂、蜡和纸灰之类，排字其上加热压平即可印，印毕再熔药拆字。常用字备二十余印，生僻字随用随刻，不用则以木格贮之。其法身后归沈括侄辈所有。",
 a:"活板印书：毕昇曾以木活字试之，因木理有疏密、沾水则高下不平且与药相粘不可取，遂改用胶泥。这一处材料取舍，是整条记载里最见工程判断力的细节。",
 f:"关于毕昇的全部可靠材料，只有《梦溪笔谈》约三百字，正史无传、墓志无存，连籍贯都未记。1990 年代甘肃武威、宁夏贺兰等地陆续发现西夏文泥活字与木活字印本，为这套工艺确曾西传并实际使用提供了实物旁证。",
 q:"（记其法）若止印三二本，未为简易；若印数十百千本，则极为神速｜《梦溪笔谈·技艺》",k:["活字","胶泥","梦溪笔谈","四大发明"],r:["沈括","蔡伦","宋应星","沈括"]},

/* ---------- 元 ---------- */
{n:"元世祖",z:"忽必烈，薛禅汗",d:"yuan",y:"1215—1294",c:"帝王",t:"定国号「大元」，行省之制自此而始",
 b:"成吉思汗之孙、拖雷第四子。1253 征大理，1259 蒙哥卒于合州后与弟阿里不哥争位，1260 即大汗于开平；1271 取《易》「大哉乾元」定国号大元，次年定都大都（今北京），1279 灭南宋完成统一。参用汉法，立中书省与十路宣抚司、设行中书省，修驿站与海运，命郭守敬等修《授时历》，用八思巴创蒙古新字。",
 a:"行省制度：为治理辽阔疆域，元廷于各地设「行中书省」作为中央中书省的派出机构，掌一省钱粮兵甲、屯种漕运。这一临时派出架构，正是今日「省」作为一级行政区划的源头。",
 f:"「大元」国号并非沿用族名或地名，而是取漢文经典《周易·乾卦》「大哉乾元，万物资始」——这是此前北方民族入主中原所建国号中，第一次明确以汉文经典文句立号，见《元史·世祖本纪》所载建国号诏。",
 q:"大哉乾元，万物资始｜《周易·乾卦》，《元史》载国号取义",k:["行省","大都","授时历","八思巴文"],r:["郭守敬","黄道婆","关汉卿","成吉思汗"]},
{n:"郭守敬",z:"字若思",d:"yuan",y:"1231—1316",c:"科学",t:"《授时历》，把回归年算到与今公历同值",
 b:"顺德邢台人，师从刘秉忠，早年即以修复邢州石桥、议治水利见知于忽必烈。至元十三年（1276）奉诏改历，与王恂、许衡等共事，创简仪、仰仪、高表、景符、窥几等十余仪，主持「四海测验」于全国设二十七处观测点，北至北海、南抵南海。至元十七年（1280）成《授时历》，次年颁行。后任都水监，修通惠河、引白浮泉水以济大都漕运。",
 a:"四海测验：至元十六年（1279），郭守敬奏「唐一行开元间令南宫说天下测景，书中见者凡十三处。今疆宇比唐尤大，若不远方测验，日月交食分数时刻不同」，遂遣监候官分道出海测北极出地高度与二至日影，为历法取得实测底数。",
 f:"《授时历》定一回归年为 365.2425 日，与 1582 年颁行的格里高利历数值完全相同，而早了约三百年；它同时废除了沿用千年的「上元积年」虚起点，直接以实测冬至为历元，是中国历法史上一次彻底的方法论转换。",
 q:"历之本在于测验，而测验之器莫先仪表｜《元史·郭守敬传》所奏大意",k:["授时历","简仪","四海测验","通惠河"],r:["元世祖","一行","祖冲之","沈括","黄道婆"]},
{n:"黄道婆",z:"松江乌泥泾人",d:"yuan",y:"约1245—约1330",c:"医农",t:"把棉纺技术带回江南，衣被天下",
 b:"松江府乌泥泾（今上海徐汇华泾）人，少时流落崖州（今海南三亚）一带，从当地黎族习得棉纺织全套技艺。元贞年间（1295—1297）附海舶返乡，见乡里棉纺尚粗，乃教以捍（轧棉）、弹、纺、织之具，改进三锭脚踏纺车，传「错纱、配色、综线、挈花」诸法，织出被褥带帨上的折枝、团凤、棋局纹样。此后松江成为全国棉纺中心。",
 a:"衣被天下：黄道婆卒后，乡人感其德，为立祠祭祀；元明以后松江布「衣被天下」，棉布逐渐取代麻布成为庶民常服，这一材料层面的更替，起点正落在乌泥泾一间织屋。",
 f:"正史无传，她最早的记载出自陶宗仪《南村辍耕录》与王逢《梧溪集》，均为私人笔记。也就是说，一位改变中国人穿衣材料的技术传播者，靠两部文人笔记才留下姓名与籍贯——技术史里最常见的一种沉默。",
 q:"（王逢诗）崖州布被五色缫，组雾紃云粲花草｜《梧溪集·黄道婆祠》",k:["棉纺","三锭纺车","乌泥泾","黎族"],r:["元世祖","郭守敬","宋应星","贾思勰"]},
{n:"关汉卿",z:"号已斋叟",d:"yuan",y:"约1220—约1300",c:"文学",t:"元曲之首，把市井与冤屈搬上舞台",
 b:"大都人（一说祁州、解州），元初杂剧作家，明初《录鬼簿》列之于「前辈已死名公才人」之首。一生不作仕宦，混迹瓦舍勾栏，与艺人往来并「躬践排场、面傅粉墨」。今归于其名下的杂剧约六十余种，存《窦娥冤》《救风尘》《望江亭》《单刀会》等十余种，散曲亦多。",
 a:"六月飞雪：《窦娥冤》写窦娥被诬毒杀公公，临刑发三桩誓愿——血飞白练、六月飞雪、亢旱三年，皆应验。以超自然手法把「冤」字推到天地失序的程度，是中国悲剧意识最强烈的一幕。",
 f:"元代科举长期停废（1238 年一度开科后中断，至 1315 年才恢复），文人失去传统进身之阶，大批转入书会为勾栏写本。元曲的爆发，与这一制度空档有直接关系——关汉卿的「不屑仕进」，未必纯粹出于性情。",
 q:"（自述）我是个蒸不烂、煮不熟、捶不匾、炒不爆、响珰珰一粒铜豌豆｜《南吕·一枝花·不伏老》",k:["窦娥冤","杂剧","瓦舍","铜豌豆"],r:["元世祖","黄道婆","曹雪芹","汤显祖"]},

/* ---------- 明 ---------- */
{n:"明太祖",z:"朱元璋，字国瑞，洪武帝",d:"ming",y:"1328—1398",c:"帝王",t:"从放牛僧到开国皇帝，重塑中枢结构",
 b:"濠州钟离（今安徽凤阳）人，出身佃农，十七岁父母兄相继死于饥疫，入皇觉寺为僧，曾托钵行乞三年。1352 投郭子兴红巾军，1356 取集庆（改应天），1364 称吴王，1368 称帝建国号明、年号洪武，同年北伐克大都。废中书省与丞相，六部直隶皇帝，设都察院、锦衣卫；编黄册与鱼鳞图册、行里甲，兴屯田水利，定《大明律》。",
 a:"洪武废相：洪武十三年（1380）以胡惟庸案废中书省、罢丞相，诏「以后嗣君并不许立丞相，臣下敢有奏请设立者，文武群臣即时劾奏，处以重刑」。秦汉以来一千六百年的宰相制度至此终止，六部与内阁成为此后五百年的基本架构。",
 f:"常有人把八股取士全算在他头上：洪武三年开科时仅诏「仿宋经义」、文体并无定格，八股的固定破题、承题、起讲、入题、起股、中股、后股、束股格式，要到成化、弘治年间才逐渐定型。他做的是把科举定为唯一正途，而非造出八股。",
 q:"（祖训）以后嗣君并不许立丞相｜《皇明祖训》",k:["废丞相","黄册","锦衣卫","洪武"],r:["郑和","王阳明","宋应星","明成祖"]},
{n:"郑和",z:"本姓马，小字三保，三宝太监",d:"ming",y:"约1371—1433",c:"侠隐",t:"七下西洋，把明初船队带到东非",
 b:"云南昆阳人，回族，父与祖父均曾赴麦加朝觐。洪武末入燕王府，靖难有功，永乐二年赐姓郑，升内官监太监。永乐三年（1405）至宣德八年（1433）七率舟师远航，历占城、爪哇、满剌加、锡兰、古里、忽鲁谟斯，最远抵红海沿岸与东非木骨都束、麻林一带，随行有《郑和航海图》、马欢《瀛涯胜览》、费信《星槎胜览》。第七次航次中卒于海上（一说归国后卒）。",
 a:"三宝太监下西洋：船队以「宣德化而柔远人」为名，行朝贡贸易与册封，沿途调解满剌加与暹罗之争、擒锡兰山王、剿灭海盗陈祖义。七次往返使印度洋沿岸三十余国与明廷建立稳定往来。",
 f:"《明史·郑和传》记宝船「修四十四丈四尺、广十八丈」，按明尺折算长约 125 米，远超木帆船结构常识，学界长期争论其可信度；南京龙江船厂遗址出土的约 11 米长舵杆常被援为旁证。可以确定的是船队规模，而非单船尺度。",
 q:"（其航海图所载）以针路定向，以更数计程｜《郑和航海图》体例",k:["七下西洋","宝船","航海图","满剌加"],r:["明太祖","明成祖","王阳明","徐光启"]},
{n:"于谦",z:"字廷益，谥肃愍，后改忠肃",d:"ming",y:"1398—1457",c:"将相",t:"北京保卫战，把一座城从崩溃边缘拉回",
 b:"钱塘人，永乐十九年进士，历御史、兵部右侍郎，巡抚河南、山西十九年，平反冤狱、赈灾修堤。正统十四年（1449）土木之变，英宗被俘、京营尽丧，朝议南迁，于谦厉声「建议南迁者，可斩也」，拥立景泰帝、整饬军备，列阵九门外督战五日击退瓦剌。后英宗复辟，以「意欲迎立外藩」被杀，籍没时家无余资。",
 a:"石灰吟：于谦十七岁作「千锤万凿出深山，烈火焚烧若等闲。粉骨碎身浑不怕，要留清白在人间」，以石灰自况。此诗最早见于明中期辑本，作者归属曾有讨论，但与其一生结局之相合，使它成为最广为传诵的言志诗之一。",
 f:"北京保卫战的关键动作不是守城，而是重建指挥链：土木之变后京营精锐尽失，于谦于一个月内调两京、河南备操军与山东、南畿备倭军入卫，改组十团营，把分散的后备兵力整编成可战之师，才有了九门列阵的本钱。",
 q:"粉骨碎身浑不怕，要留清白在人间｜《石灰吟》",k:["土木之变","北京保卫战","团营","清白"],r:["明太祖","戚继光","文天祥","张居正"]},
{n:"王阳明",z:"名守仁，字伯安，号阳明",d:"ming",y:"1472—1529",c:"思想",t:"龙场悟道，把「知」重新接回「行」",
 b:"浙江余姚人，弘治十二年进士。正德元年（1506）上疏救戴铣等忤刘瑾，廷杖四十、谪贵州龙场驿丞，正德三年于此悟「心即理」「知行合一」。后巡抚南赣平匪，正德十四年（1519）以临时凑集之兵三十五日擒宁王朱宸濠；嘉靖间总督两广，平思田之乱，晚揭「致良知」与「万物一体之仁」。嘉靖七年卒于南安舟中。",
 a:"龙场悟道：谪所「在万山丛棘中，蛇虺魍魉、蛊毒瘴疠」，无屋无书、随从皆病，他日夜端居澄默，忽中夜大悟「圣人之道，吾性自足，向之求理于事物者误也」，见《王阳明年谱》。",
 f:"王阳明不是只会讲学的书生：平宁王之乱时手上无兵符，靠檄文与临时征集的府县兵，用疑兵、断归路、攻南昌老巢迫使朱宸濠回师，再决战鄱阳湖生擒之。心学讲「事上磨炼」，他自己先在最硬的事上磨过一轮。",
 q:"破山中贼易，破心中贼难｜《与杨仕德薛尚谦书》",k:["心学","知行合一","致良知","龙场"],r:["朱熹","于谦","明太祖","张居正"]},
{n:"戚继光",z:"字元敬，号南塘",d:"ming",y:"1528—1588",c:"将相",t:"以一套阵法与一部兵书重整海防",
 b:"登州卫人，世袭登州卫指挥佥事。嘉靖三十四年（1555）调浙江抗倭，见卫所军不堪用，乃于义乌募矿工、农民三千，创「鸳鸯阵」：十二人一队，长短兵器与盾牌、狼筅相配，随地形变阵。台州九战九捷，后入闽粤剿倭，隆庆间调蓟州练兵、修空心敌台，著《纪效新书》《练兵实纪》。万历间被劾罢归，卒于家。",
 a:"鸳鸯阵：以十一人加一名火兵编队，盾牌手掩护、狼筅手制敌、长枪手刺杀、镋钯手策应，专克倭寇擅长的小股近身突袭。阵法与其说是队列，不如说是一份把个体差异写进编制的作战分工表。",
 f:"《纪效新书》开篇即申明「凡比较武艺，务要俱照示学习实敌本事，真可对搏打者，不许仍学习花枪等法」——直接禁掉表演性套路。他甚至把赏罚、号令、识字课本都写进兵书，是古代少见的、按可训练可复制思路编写的军事教材。",
 q:"（其练兵宗旨）练兵之要，先在练胆；胆气既壮，技艺自精｜《纪效新书》大意",k:["鸳鸯阵","纪效新书","抗倭","空心敌台"],r:["于谦","张居正","王阳明","郑成功"]},
{n:"李时珍",z:"字东璧，号濒湖山人",d:"ming",y:"1518—1593",c:"医农",t:"二十七年，一部《本草纲目》",
 b:"蕲州（今湖北蕲春）人，出身世医，十四岁中秀才后三试举人不第，遂弃举业随父行医，曾任职楚王府奉祠正、太医院院判一年即辞。自嘉靖三十一年（1552）起，参阅八百余家典籍，远赴武当、庐山、茅山及湖广、江西、南直隶采药访农，三易其稿，至万历六年（1578）成《本草纲目》五十二卷。",
 a:"尝百草：为辨药性与形态，李时珍不独据书本，亲自试服、观察、访问药农与渔户，纠正旧本草中「葳蕤、女萎二物并为一物」「南星、虎掌混称」等沿袭数百年的名实错乱。",
 f:"《本草纲目》载药 1892 种（新增 374 种）、附方 11096 首、药图 1109 幅，并按「从微至巨、从贱至贵」分十六部六十类，分类思路已近自然系统。全书直到 1596 年（他卒后三年）才由金陵胡承龙刊行，本人未及见刻本问世。",
 q:"（其编书之旨）医者贵在格物｜《本草纲目》序例述其考订之法",k:["本草纲目","药物分类","蕲州","采药"],r:["孙思邈","张仲景","宋应星","徐光启"]},
{n:"徐光启",z:"字子先，号玄扈，文定公",d:"ming",y:"1562—1633",c:"科学",t:"以翻译为起点，接上中西科学的第一根线",
 b:"上海县人，万历二十五年解元、三十二年进士，选庶吉士，官至礼部尚书兼东阁大学士。1600 年在南京识利玛窦，1607 年合译《几何原本》前六卷，另译《测量法义》《泰西水法》；自著《农政全书》六十卷，推广甘薯与棉花；崇祯二年（1629）奉诏督修历法，组织编译《崇祯历书》，引进第谷体系与球面三角，兼管练兵与火器。",
 a:"几何之名：欧几里得《几何原本》原书名里的 geo-（意为土地、测地）与「几何」本不对应，徐光启与利玛窦取「几何」二字既谐其音、又合中文「多少、度量」之义，定名《几何原本》。点、线、面、直角、平行线、三角形等译名，亦多在此书中定型，沿用至今。",
 f:"他提出「欲求超胜，必须会通；会通之前，先须翻译」，把译书排在赶超之前。可惜《几何原本》只译了前六卷（平面几何部分），后九卷要等 1857 年李善兰与伟烈亚力续译才补齐——中间隔了整整二百五十年。",
 q:"欲求超胜，必须会通；会通之前，先须翻译｜《历书总目表》",k:["几何原本","农政全书","崇祯历书","利玛窦"],r:["利玛窦","李时珍","宋应星","郑和"]},
{n:"宋应星",z:"字长庚",d:"ming",y:"1587—约1666",c:"科学",t:"《天工开物》，为手艺与器物立传",
 b:"江西奉新人，万历四十三年举人，此后五次会试不第，历任江西分宜教谕、福建汀州推官、亳州知州。崇祯十年（1637）在分宜任上刊《天工开物》十八卷，分乃粒、粹精、作咸、甘嗜、陶埏、冶铸、舟车、锤锻、燔石、杀青、五金、佳兵、丹青、曲蘖、珠玉诸篇，附图 123 幅，逐项记原料、工具、工序与产量。明亡后弃官归里，约卒于清初。",
 a:"天工开物：书名取《尚书》「天工人其代之」与《易》「开物成务」，意谓人循自然之理而开成万物。全书开篇另有一句极清醒的自序：「此书于功名进取毫不相关也」——他明知这类知识在当时不入仕途。",
 f:"《天工开物》在国内一度近乎失传，清代《四库全书》未收，反倒由 17 世纪传入日本，在江户、明治间多次翻刻，成为日本实学与工艺研究的重要读本；20 世纪初才经学者从日本藏本回传中国，重新刊行。",
 q:"天覆地载，物数号万，而事亦因之曲成而不遗｜《天工开物·序》",k:["天工开物","工艺","冶金","实学"],r:["贾思勰","徐光启","李时珍","黄道婆","沈括"]},
{n:"郑成功",z:"名森，字明俨、大木，国姓爷",d:"ming",y:"1624—1662",c:"将相",t:"自荷兰殖民者手中收复台湾",
 b:"福建南安人，父郑芝龙、母田川氏。隆武帝赐国姓朱、号「国姓爷」，1646 年父降清，他焚儒服起兵，据金门、厦门抗清十余年，1659 年一度围南京而败。1661 年率军自鹿耳门乘潮登陆台湾，围热兰遮城（今台南安平古堡）九月，断其水源，1662 年 2 月荷兰总督揆一签约投降，台湾收复；同年六月病卒，年三十九。",
 a:"鹿耳门潮涨：鹿耳门水道浅窄、荷军以为大船难入而未设重防，郑军趁大潮骤涨，以小船先导引主力舰队循水道入台江内海，一举登陆赤崁，是此役最关键的一次时机判断。",
 f:"这段史事有双方档案可对读：中文方面有《从征实录》《海上见闻录》，荷兰方面有东印度公司《热兰遮城日志》与总督揆一后来的辩护书《被忽视的福尔摩沙》。围城九个月、双方兵力与谈判条款，可逐条互证，在中国古代战史中相当罕见。",
 q:"（其起兵时语）昔为孺子，今为孤臣，向背去留，各行其是｜据《从征实录》所记焚服誓师",k:["收复台湾","热兰遮城","鹿耳门","国姓爷"],r:["戚继光","明太祖","郑和","林则徐"]},

{n:"康熙帝",z:"爱新觉罗·玄烨，圣祖",d:"qing",y:"1654—1722",c:"帝王",t:"在位六十一年，奠定清代疆域与治理框架",
 b:"顺治第三子，八岁即位、十四岁亲政，1669 年除鳌拜，1673—1681 年平三藩，1683 年施琅平台湾、次年设台湾府隶福建，1689 年与俄国订《尼布楚条约》，三征噶尔丹、1691 年多伦会盟；治黄淮、行「滋生人丁永不加赋」（1712），组织编《康熙字典》《全唐诗》《古今图书集成》，用传教士实测绘制《皇舆全览图》。",
 a:"滋生人丁永不加赋：康熙五十一年（1712）诏以五十年全国丁册为定额，此后新增人丁不再加征丁银。这一「固定税基」的做法，为雍正朝「摊丁入亩」把丁银并入田赋铺平了路，也深刻影响了此后人口统计口径。",
 f:"《皇舆全览图》自 1708 至 1718 年，由传教士与中方官员分路实测，采用经纬度定位与三角测量，绘成覆盖满蒙、内地与西藏的全国地图，是当时世界上规模最大的实测地图工程之一，比多数欧洲国家的全国实测地图更早。",
 q:"（其治河谕旨）黄河之患，关系运道民生，最为紧要｜《清圣祖实录》大意",k:["平三藩","尼布楚条约","皇舆全览图","摊丁入亩"],r:["曹雪芹","魏源","郑成功","詹天佑"]},
{n:"曹雪芹",z:"名霑，字梦阮，号雪芹、芹溪",d:"qing",y:"约1715—约1763",c:"文学",t:"批阅十载，把一门兴衰写成一部百科",
 b:"江宁织造曹寅之孙，曹家三代任江宁织造、六次接驾南巡，雍正初以亏空被抄，举家迁北京。晚年居西郊黄叶村，生活困顿，「举家食粥酒常赊」，仍以十年之力「批阅十载、增删五次」写《石头记》。乾隆二十七年前后因幼子夭亡感伤成疾，除夕前后卒，书未定稿。",
 a:"脂砚斋评本：今存甲戌、己卯、庚辰等《脂砚斋重评石头记》抄本，评语中透露后文情节与删改缘由（如「秦可卿淫丧天香楼」因批者命删而改），使小说未完部分与成书过程一同成为研究对象，催生了专门的版本学与「红学」。",
 f:"今通行一百二十回本的后四十回，一般认为非曹雪芹所作：1791 年程伟元、高鹗以木活字排印「程甲本」，首次合成全帙，序中称后四十回得自藏书家与鼓担陆续搜得。作者究竟是高鹗续作、还是无名氏旧稿经程高整理，学界至今仍在讨论。",
 q:"满纸荒唐言，一把辛酸泪｜《红楼梦·第一回》",k:["红楼梦","石头记","脂评本","程甲本"],r:["蒲松龄","关汉卿","纪昀","曹寅"]},
{n:"蒲松龄",z:"字留仙，一字剑臣，号柳泉居士",d:"qing",y:"1640—1715",c:"文学",t:"一生坐馆，把民间口耳写成《聊斋》",
 b:"山东淄川人，十九岁以县、府、道三试第一补廪膳生员，此后屡应乡试不第，七十一岁方援例出贡。一生大半在西铺毕家等处设馆授徒，余暇于村口柳泉旁设茶摊，邀行人谈异闻，据以成篇。《聊斋志异》今存约四百九十余篇，另有俚曲、文集与农桑杂著。",
 a:"聊斋设茶：相传蒲松龄于淄川柳泉边置茶，凡过路者讲一异事即可免费饮茶，积久成帙。此说出自清人笔记与后世口碑，未必可按为实录，却与书中大量「某邑某生言」的口述标记相合。",
 f:"《聊斋志异》写的狐鬼，多半不是志怪趣味：《促织》借斗蟋蟀写里胥催逼致民家破亡，《席方平》写阴间官府层层受贿，直指「衙门自古向南开」的现实。鲁迅评其「用传奇法，而以志怪」，点明它是以小说笔法写人间。",
 q:"（其自序）集腋为裘，妄续幽冥之录；浮白载笔，仅成孤愤之书｜《聊斋自志》",k:["聊斋志异","柳泉","孤愤","坐馆"],r:["曹雪芹","纪昀","关汉卿"]},
{n:"纪昀",z:"字晓岚，一字春帆，谥文达",d:"qing",y:"1724—1805",c:"文学",t:"《四库全书》总纂官，也是《阅微草堂笔记》作者",
 b:"直隶献县人，乾隆十九年进士，入翰林，曾任福建学政、左都御史、礼部尚书、协办大学士。乾隆三十八年（1773）开四库全书馆，与陆锡熊等任总纂官，历时十余年主持编定《四库全书》及《四库全书总目提要》二百卷，晚年著《阅微草堂笔记》五种二十四卷。",
 a:"总目提要：《四库全书总目》为收书三千四百余种、存目六千七百余种逐一撰写提要，辨版本、考作者、论源流，另立凡例与部类小序，把目录学做成一套可检索的学术史，至今仍是查考古籍的基本工具。",
 f:"《四库全书》既是保存也是筛选：编纂过程中以「违碍」「悖谬」为由禁毁、抽改书籍数千种，且提要的评判多以官方正统为准。今日使用这部丛书，往往要与《四库禁毁书丛刊》《四库撤毁书提要》对读，才看得见被删去的部分。",
 q:"（其笔记自述）昼夜无事，追录见闻，姑以消遣岁月而已｜《阅微草堂笔记》序意",k:["四库全书","总目提要","目录学","禁毁"],r:["曹雪芹","蒲松龄","康熙帝","魏源"]},
{n:"王清任",z:"字勋臣，玉田人",d:"qing",y:"1768—1831",c:"医农",t:"以实地观察纠正脏腑旧图",
 b:"直隶玉田（今河北）人，武庠生，后习医，在北京、奉天等地行医。因读古医书见脏腑图说互异，遂趁疫病流行时于义冢、刑场反复观察童尸与残躯，历时四十二年绘成脏腑图，道光十年（1830）刊《医林改错》二卷，改正古人关于肺、肝、膈膜等若干记述，并创血府逐瘀汤、补阳还五汤等逐瘀方剂。",
 a:"医林改错：书名直指「改错」。他明言「著书不明脏腑，岂不是痴人说梦；治病不明脏腑，何异于盲子夜行」，把解剖观察放在经典注疏之前，是清代医学里少见的实证取向。",
 f:"他的观察条件极为有限（多为刑后残尸、疫殁童尸，无法系统解剖），因此所绘亦有误，如把动脉认作气管、未见胰脏等；但他把「气血瘀滞」与中风、半身不遂联系起来的思路，以及补阳还五汤等方，至今仍在临床使用。可贵的不是每图皆对，而是肯以所见疑所读。",
 q:"治病不明脏腑，何异于盲子夜行｜《医林改错·脏腑记叙》",k:["医林改错","脏腑图","逐瘀","实证"],r:["李时珍","孙思邈","张仲景","魏源"]},

{n:"林则徐",z:"字元抚，一字少穆",d:"modern",y:"1785—1850",c:"将相",t:"虎门销烟，也是近代开眼看世界的起点",
 b:"福建侯官人，嘉庆十六年进士，历江苏按察使、湖广总督。道光十八年（1838）受命钦差大臣赴粤禁烟，次年 6 月 3 日至 25 日于虎门海滩以海水浸化法销毁鸦片 237 万余斤；同时组织译《四洲志》《澳门新闻纸》、购西洋炮船、加固虎门工事。鸦片战争爆发后被革职，1842 谪戍伊犁，在新疆兴水利、推广坎儿井与屯垦，后复起任陕甘、云贵总督。",
 a:"海水浸化：虎门销烟不是点火焚烧，而是先挖两方池、引海水入池，投盐卤使鸦片浸泡半日，再抛石灰，石灰遇水沸滚将烟土溶化，最后开涵洞随潮入海。改用此法，正是为防止焚烧后鸦片膏渗入泥土被人掘取复吸。",
 f:"他把在粤搜集的《四洲志》及一批西文资料交给魏源，嘱其编成「师夷长技以制夷」之书，即后来的《海国图志》。禁烟是他在广州做得最显眼的事，而影响更长远的，或许是这次资料移交。",
 q:"苟利国家生死以，岂因祸福避趋之｜《赴戍登程口占示家人》",k:["虎门销烟","四洲志","开眼看世界","伊犁"],r:["魏源","孙中山","文天祥","郑成功"]},
{n:"魏源",z:"字默深",d:"modern",y:"1794—1857",c:"思想",t:"《海国图志》，师夷长技以制夷",
 b:"湖南邵阳人，道光二十五年进士，与龚自珍同属今文经学派，曾入林则徐幕。1842 年成《圣武记》，同年据林则徐所交《四洲志》及历代史志、西人地图编成《海国图志》五十卷，1847 增为六十卷、1852 扩至一百卷，记世界各国地理、政制、船炮、历法，并附《筹海篇》论战守之策。另著《书古微》《诗古微》《默觚》。",
 a:"师夷长技以制夷：《海国图志·原叙》明言「是书何以作？曰：为以夷攻夷而作，为以夷款夷而作，为师夷长技以制夷而作」。三句把「学对方」与「御对方」并置，构成此后数十年洋务论说的基本句法。",
 f:"此书在中国刊行后长期冷落，反倒是 1850 年代传入日本被反复翻刻、训点，成为幕末志士了解世界的主要读本之一。梁启超后来在《中国近三百年学术史》里为此慨叹：其书在中国「不过覆瓿」，在日本却助成了维新气象。",
